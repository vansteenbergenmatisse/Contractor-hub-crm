<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GreenLane v2 · Settings · Option A, every step</title>
<!--
  GreenLane v2 contractor dashboard: Settings, option A (guided steps, every step on one page).
  REFERENCE DESIGN. Sample values for the Northway Roofing sample business. One file, no outside files.
  - The values are the GoHighLevel custom values of the sub-account. Keys never change, only values.
  - Every image gets compressed before it goes up: logo 512 px, tab icon 192 px, sign-in photo 1920 by 1080 at most, WebP at quality 0.82.
  - Services and areas are protected: unlock one folder (tick the box first), change it, check the changes, save. It locks again.
  - Search the script for "BACKEND" for what the server has to do.
-->
<style>

/* GreenLane v2 contractor dashboard, Settings redesign. Sample values for the Northway Roofing sample business (Columbus, OH). */
/* GoHighLevel custom values, folder 02_Branding: the script writes each color into the variable named after its key (main_color -> --main-color). */
:root:root,.brand-scope{
--main-color:#2E7D32;--main-hover-color:#256528;--main-light-color:#4AA44E;--main-background-color:#EAF5E6;--main-border-color:#BEDEB6;
--sub-color:#0F2740;--highlight-color:#F5A524;--error-color:#B3261E;--background-color:#FFFFFF;--section-background-color:#F1F5F8;
--border-color:#D0DAE2;--text-color:#4A5A6B;--light-text-color:#5E6E7E;--text-on-main-color:#FFFFFF;
--body-font:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
--code-font:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}

body{margin:0;background:var(--section-background-color)}
.sv-app{
  --pg:var(--section-background-color);--card:var(--background-color);--ink:var(--sub-color);--mut:var(--text-color);--mut2:var(--light-text-color);
  --line:var(--border-color);--hair:color-mix(in srgb,var(--border-color) 55%,var(--background-color));
  --warn-bg:color-mix(in srgb,var(--highlight-color) 20%,var(--background-color));--warn-tx:oklch(from var(--highlight-color) 0.42 calc(c * 0.8) h);
  --bad-bg:color-mix(in srgb,var(--error-color) 9%,var(--background-color));--bad-tx:var(--error-color);
  --shadow:0 1px 2px color-mix(in srgb,var(--sub-color) 5%,transparent),0 10px 30px color-mix(in srgb,var(--sub-color) 6%,transparent);
  --ring:0 0 0 3px color-mix(in srgb,var(--main-color) 28%,transparent);
  --t-press:100ms;--t-small:180ms;--t-mid:220ms;--t-panel:260ms;--e-out:cubic-bezier(0,0,.2,1);--e-std:cubic-bezier(.4,0,.2,1);
  position:relative;display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh;background:var(--pg);color:var(--ink);
  font-family:var(--body-font);font-size:1.0625rem;line-height:1.375rem;letter-spacing:-0.026em;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.sv-app *,.sv-app *::before,.sv-app *::after{box-sizing:border-box}
:where(.sv-app) :where(button,input,textarea){font:inherit;letter-spacing:inherit;color:inherit}
:where(.sv-app) :where(button){cursor:pointer}
.sv-app :focus-visible{outline:2px solid var(--main-color);outline-offset:2px}
:where(.sv-app) :where(h1,h2,h3,p,ol,ul){margin:0}
:where(.sv-app) :where(ol,ul){padding:0;list-style:none}
.sv-hid{display:none !important}

/* the app menu (computer) */
.sv-side{position:sticky;top:0;display:flex;flex-direction:column;gap:2px;height:100vh;padding:20px 14px 18px;border-right:1px solid var(--line);background:var(--pg);overflow:auto}
.sv-brand,.sv-me{display:flex;align-items:center;gap:12px;padding:2px 8px}
.sv-brand{margin-bottom:8px}
.sv-logo{display:grid;place-items:center;flex:none;width:40px;height:40px;border-radius:12px;background:var(--main-color);color:var(--text-on-main-color);font-weight:700;font-size:1rem}
.sv-bt{display:flex;flex-direction:column;min-width:0}
.sv-bname,.sv-mname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:1.0625rem;line-height:1.375rem}
.sv-mname{font-size:0.9375rem;line-height:1.25rem}
.sv-me .sv-link{font-size:0.8125rem}
.sv-bsub{color:var(--mut);font-size:0.8125rem;line-height:1.125rem;letter-spacing:-0.006em}
.sv-grp{margin:14px 10px 4px;color:var(--mut);font-size:0.8125rem;font-weight:600;letter-spacing:0.02em;text-transform:uppercase}
.sv-nav{display:flex;align-items:center;gap:11px;width:100%;min-height:44px;padding:6px 10px;border:0;border-radius:10px;background:none;font-size:0.9375rem;line-height:1.25rem;letter-spacing:-0.016em;text-align:left;transition:background-color var(--t-small) var(--e-std)}
.sv-nav:hover{background:color-mix(in srgb,var(--sub-color) 5%,transparent)}
.sv-nav svg{flex:none;color:var(--mut)}
.sv-nl{flex:1;min-width:0}
.sv-nav.is-on{background:var(--main-color);color:var(--text-on-main-color);font-weight:600;box-shadow:0 6px 16px color-mix(in srgb,var(--main-color) 30%,transparent)}
.sv-nav.is-on svg{color:currentColor}
.sv-nbadge{display:grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--error-color);color:#fff;font-size:0.8125rem;font-weight:600}
.sv-sp{flex:1}
.sv-me{margin-top:10px;padding-top:14px;border-top:1px solid var(--line)}
.sv-av{display:grid;place-items:center;flex:none;width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:0.8125rem;font-weight:600}
.sv-me > .sv-bt{flex:1}
.sv-link{flex:none;white-space:nowrap;min-height:44px;margin-left:auto;padding:0 4px;border:0;background:none;color:var(--main-hover-color);font-size:0.9375rem;font-weight:600}

/* main column and top bar */
.sv-main{min-width:0;padding:20px 36px 56px}
.sv-top{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-bottom:28px}
.sv-mtop{display:none}
.sv-search{display:flex;align-items:center;gap:10px;flex:0 1 340px;height:44px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--mut);font-size:0.9375rem;text-align:left}
.sv-sl{flex:1}
.sv-search kbd{padding:1px 6px;border:1px solid var(--line);border-radius:6px;font-family:var(--body-font);font-size:0.8125rem}
.sv-head{margin-bottom:20px}
.sv-h1{font-size:2.125rem;line-height:2.5625rem;letter-spacing:0.011em;font-weight:700;text-wrap:balance}
.sv-lead{max-width:62ch;margin-top:6px;color:var(--mut);font-size:1.0625rem;line-height:1.375rem}

/* buttons */
.sv-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border:1px solid var(--main-border-color);border-radius:12px;background:var(--main-background-color);color:var(--main-hover-color);font-size:0.9375rem;font-weight:600;line-height:1.25rem;letter-spacing:-0.016em;white-space:nowrap;transition:transform var(--t-press) var(--e-std),background-color var(--t-small) var(--e-std),box-shadow var(--t-small) var(--e-std)}
.sv-btn:active,.sv-nav:active,.sv-tab:active{transform:scale(.97)}
.sv-btn.is-fill{border-color:var(--main-color);background:var(--main-color);color:var(--text-on-main-color);box-shadow:0 6px 16px color-mix(in srgb,var(--main-color) 26%,transparent)}
.sv-btn.is-fill:hover{background:var(--main-hover-color)}
.sv-btn.is-plain{border-color:var(--line);background:var(--card);color:var(--ink)}
.sv-btn.is-tint{border-color:transparent;background:var(--main-background-color);color:var(--main-hover-color)}
.sv-btn.is-ghost{border-color:transparent;background:none;color:var(--main-hover-color)}
.sv-btn.is-sm{min-height:36px;padding:0 12px;border-radius:10px;font-size:0.875rem}
.sv-btn.is-danger{border-color:color-mix(in srgb,var(--error-color) 30%,var(--background-color));background:var(--bad-bg);color:var(--bad-tx)}
.sv-btn.is-sm::after{content:"";position:absolute;inset:-4px}
.sv-btn{position:relative}

/* cards, chips, meters */
.sv-card{min-width:0;border:1px solid var(--line);border-radius:20px;background:var(--card);box-shadow:var(--shadow)}
.sv-chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px 3px 8px;border-radius:999px;background:var(--pg);color:var(--mut);font-size:0.8125rem;font-weight:600;line-height:1.125rem;letter-spacing:-0.006em;white-space:nowrap}
.sv-chip.is-ok{background:var(--main-background-color);color:var(--main-hover-color)}
.sv-chip.is-warn{background:var(--warn-bg);color:var(--warn-tx)}
.sv-chip.is-bad{background:var(--bad-bg);color:var(--bad-tx)}
.sv-fk{display:inline-flex;align-items:center;max-width:100%;padding:2px 8px;border:1px solid var(--hair);border-radius:8px;background:var(--pg);color:var(--mut);font-family:var(--code-font);font-size:0.8125rem;line-height:1.125rem;letter-spacing:0;overflow-wrap:anywhere}
.sv-dnt{display:inline-flex;align-items:center;gap:5px;padding:3px 10px 3px 8px;border-radius:999px;background:var(--error-color);color:#fff;font-size:0.8125rem;font-weight:600;line-height:1.125rem;letter-spacing:0.01em;white-space:nowrap}
.sv-bar{position:relative;display:block;height:6px;border-radius:999px;background:var(--hair);overflow:hidden}
.sv-bar > i{position:absolute;inset:0 auto 0 0;width:var(--p,0%);border-radius:inherit;background:var(--main-color);transition:width var(--t-panel) var(--e-out)}
.sv-ring{--p:0;display:grid;place-items:center;flex:none;width:44px;height:44px;border-radius:50%;background:conic-gradient(var(--main-color) calc(var(--p) * 1%),var(--hair) 0)}
.sv-ring::before{content:"";grid-area:1/1;width:34px;height:34px;border-radius:50%;background:var(--card)}
.sv-ring > svg{grid-area:1/1;position:relative;color:var(--main-color)}

/* fields */
.sv-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 20px}
.sv-f{display:flex;flex-direction:column;gap:6px;min-width:0}
.sv-f.is-wide{grid-column:1 / -1}
.sv-lr{display:flex;align-items:center;gap:8px;min-height:22px}
.sv-l{font-size:0.9375rem;font-weight:600;line-height:1.25rem;letter-spacing:-0.016em}
.sv-k{display:none;font-family:var(--code-font);font-size:0.8125rem;line-height:1.125rem;letter-spacing:0;color:var(--mut2);overflow-wrap:anywhere}
.is-keys .sv-k{display:block}
.sv-fe{display:none;align-items:center;gap:4px;padding:1px 8px 1px 6px;border-radius:999px;background:var(--warn-bg);color:var(--warn-tx);font-size:0.8125rem;font-weight:600;line-height:1.125rem;letter-spacing:-0.006em}
.sv-fe.is-on{display:inline-flex}
.sv-in{display:block;width:100%;min-width:0;height:48px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-size:1.0625rem;line-height:1.375rem;transition:border-color var(--t-small) var(--e-std),box-shadow var(--t-small) var(--e-std)}
.sv-in:hover{border-color:color-mix(in srgb,var(--sub-color) 30%,var(--border-color))}
.sv-in:focus{outline:none;border-color:var(--main-color);box-shadow:var(--ring)}
.sv-ta{height:auto;min-height:92px;padding:12px 14px;resize:vertical}
.sv-f.is-empty .sv-in{border-style:dashed;background:color-mix(in srgb,var(--highlight-color) 4%,var(--background-color))}
.sv-f.is-empty .sv-in:focus{border-style:solid;background:var(--card)}
.sv-f.is-err .sv-in,.is-err > .sv-in{border-color:var(--error-color);box-shadow:0 0 0 3px color-mix(in srgb,var(--error-color) 18%,transparent)}
.sv-h{color:var(--mut);font-size:0.8125rem;line-height:1.125rem;letter-spacing:-0.006em}
.sv-err{display:none;align-items:flex-start;gap:6px;color:var(--bad-tx);font-size:0.875rem;font-weight:600;line-height:1.25rem}
.sv-err.is-on{display:flex}
.sv-err > svg{flex:none;margin-top:2px}
.sv-soc{display:grid;place-items:center;flex:none;width:24px;height:24px;border-radius:7px;color:#fff}
.sv-soc.is-fb{background:#3F51B5}.sv-soc.is-ig{background:#C2410C}.sv-soc.is-yp{background:#B71C1C}.sv-soc.is-yt{background:#9F1239}
.sv-geo{align-self:flex-start}
@media (min-width: 1024px){ .va-card,.vc-card{container:svf / inline-size} }
@container svf (max-width: 600px){ .sv-fields{grid-template-columns:minmax(0,1fr)} }
.sv-cg{container-type:inline-size}
@container (max-width: 300px){ .sv-cf{grid-template-columns:auto minmax(0,1fr)} .sv-cf > .sv-hex{grid-column:2} }

/* image fields */
.sv-img{display:flex;align-items:flex-start;gap:14px}
.sv-imr{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.sv-ima{display:flex;gap:8px;flex-wrap:wrap}
.sv-tile{position:relative;display:grid;place-items:center;flex:none;width:84px;height:84px;border:1px solid var(--line);border-radius:16px;background:var(--pg);overflow:hidden}
.sv-tile.is-wide{width:140px}
.sv-tl-logo{display:grid;place-items:center;width:60px;height:60px;border-radius:16px;background:var(--main-color);color:var(--text-on-main-color);font-size:1.5rem;font-weight:700;letter-spacing:0}
.sv-tl-fav{display:grid;place-items:center;width:32px;height:32px;border-radius:8px;background:var(--main-color);color:var(--text-on-main-color);font-size:0.875rem;font-weight:700}
.sv-tl-bg{position:absolute;inset:0;background:linear-gradient(180deg,#BFD7EA 0 55%,#7C9A6B 55% 100%)}
.sv-tl-bg::before{content:"";position:absolute;left:18%;right:18%;bottom:30%;height:38%;background:linear-gradient(135deg,transparent 49%,#5B3A29 50%) left/50% 100% no-repeat,linear-gradient(225deg,transparent 49%,#5B3A29 50%) right/50% 100% no-repeat}
.sv-tl-none{display:none;flex-direction:column;align-items:center;gap:2px;color:var(--mut);font-size:0.8125rem;line-height:1.125rem;text-align:center}
.sv-tile.is-none{border-style:dashed;background:color-mix(in srgb,var(--highlight-color) 5%,var(--background-color))}
.sv-tile.is-none > :not(.sv-tl-none){display:none}
.sv-tile.is-none > .sv-tl-none{display:flex}

/* brand colors */
.sv-cb{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px}
.sv-cbl{display:flex;flex-direction:column;gap:10px;min-width:0}
.sv-cbt{font-size:1.0625rem;font-weight:600;line-height:1.375rem}
.sv-pres{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.sv-pz{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px 0 8px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:0.9375rem;transition:border-color var(--t-small) var(--e-std),box-shadow var(--t-small) var(--e-std)}
.sv-pz.is-on{border-color:var(--main-color);box-shadow:var(--ring);font-weight:600}
.sv-psw{width:26px;height:26px;border-radius:8px;box-shadow:inset 0 0 0 1px color-mix(in srgb,#000 12%,transparent)}
.sv-custom{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.sv-hexrow{display:flex;gap:10px;align-items:center}
.sv-hex{font-family:var(--code-font);letter-spacing:0;text-transform:uppercase;max-width:180px}
.sv-hex.is-sm{height:40px;max-width:124px;font-size:0.9375rem;padding:0 10px}
.sv-swl{position:relative;display:block;flex:none;cursor:pointer}
.sv-sw{display:block;width:44px;height:44px;border-radius:12px;box-shadow:inset 0 0 0 1px color-mix(in srgb,#000 14%,transparent)}
.sv-pick{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.sv-prev{display:flex;flex-direction:column;gap:10px;min-width:0}
.sv-prt{color:var(--mut);font-size:0.8125rem;font-weight:600;letter-spacing:0.02em;text-transform:uppercase}
.sv-pcard{display:flex;flex-direction:column;gap:8px;padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--pg)}
.sv-pchip{display:inline-flex;align-items:center;gap:5px;align-self:flex-start;padding:2px 9px 2px 7px;border-radius:999px;background:var(--main-background-color);color:var(--main-hover-color);font-size:0.8125rem;font-weight:600}
.sv-ph{color:var(--sub-color);font-size:1.25rem;font-weight:700;line-height:1.5625rem}
.sv-pp{color:var(--text-color);font-size:0.9375rem;line-height:1.25rem}
.sv-pb{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:4px}
.sv-pbtn{display:inline-flex;align-items:center;min-height:40px;padding:0 16px;border-radius:10px;background:var(--main-color);color:var(--text-on-main-color);font-size:0.9375rem;font-weight:600}
.sv-plink{color:var(--main-hover-color);font-size:0.9375rem;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.sv-ct{display:flex;align-items:flex-start;gap:6px;color:var(--main-hover-color);font-size:0.875rem;font-weight:600;line-height:1.25rem}
.sv-ct.is-bad{color:var(--bad-tx)}
.sv-ct > svg{flex:none;margin-top:2px}
.sv-more{display:inline-flex;align-items:center;gap:8px;min-height:44px;margin-top:18px;padding:0 4px;border:0;background:none;color:var(--main-hover-color);font-size:0.9375rem;font-weight:600}
.sv-more svg{transition:transform var(--t-small) var(--e-std)}
.sv-more[aria-expanded="true"] svg{transform:rotate(180deg)}
.sv-all{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:16px;margin-top:6px}
.sv-cg{display:flex;flex-direction:column;gap:8px;min-width:0;padding:14px;border:1px solid var(--hair);border-radius:16px}
.sv-cgt{font-size:0.9375rem;font-weight:600}
.sv-cgr{display:flex;flex-direction:column;gap:8px}
.sv-cf{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:6px 12px}
.sv-cf .sv-sw{width:36px;height:36px;border-radius:10px}
.sv-cf > .sv-err{grid-column:1 / -1}
.sv-cft{display:flex;flex-direction:column;min-width:0}
.sv-cfl{font-size:0.9375rem;line-height:1.25rem}
.sv-cfv{font-family:var(--code-font);font-size:0.9375rem;letter-spacing:0;color:var(--mut)}

/* Do not touch, read-only lists */
.sv-ll{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 20px;counter-reset:x}
.sv-ll li{display:flex;align-items:baseline;gap:10px;min-width:0;padding:7px 0;border-bottom:1px solid var(--hair);font-size:0.9375rem;line-height:1.25rem}
.sv-ll li.is-none{color:var(--mut2);font-style:italic}
.sv-lln{flex:none;min-width:22px;color:var(--mut2);font-size:0.8125rem;font-variant-numeric:tabular-nums;text-align:right}

/* connections and choices */
.sv-crl{display:flex;flex-direction:column}
.sv-cr{display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px;min-height:64px;padding:10px 0;border-bottom:1px solid var(--hair)}
.sv-cr:last-child{border-bottom:0}
.sv-cri{display:grid;place-items:center;flex:none;width:36px;height:36px;border-radius:10px;background:var(--pg);color:var(--ink)}
.sv-crt{display:flex;flex-direction:column;flex:1 1 170px;min-width:0}
.sv-crn{font-size:1rem;font-weight:600;line-height:1.3125rem}
.sv-crs{color:var(--mut);font-size:0.875rem;line-height:1.25rem}
.sv-subh{margin:22px 0 4px;font-size:1.0625rem;font-weight:600}
.sv-switch{position:relative;flex:none;width:51px;height:31px;padding:0;border:0;border-radius:999px;background:color-mix(in srgb,var(--sub-color) 18%,var(--background-color));transition:background-color var(--t-small) var(--e-std)}
.sv-switch::after{content:"";position:absolute;inset:-7px -2px}
.sv-swk{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform var(--t-small) var(--e-std)}
.sv-switch.is-on{background:var(--main-color)}
.sv-switch.is-on .sv-swk{transform:translateX(20px)}
.sv-onoff{min-width:26px;color:var(--mut);font-size:0.8125rem;font-weight:600}
.sv-swrow{display:flex;align-items:center;gap:12px;min-height:44px}
.sv-swrow .sv-swt{flex:1;min-width:0;font-size:0.9375rem;line-height:1.25rem}

/* toast and the message sheet */
.sv-toast{position:fixed;left:50%;bottom:28px;z-index:60;display:flex;align-items:center;gap:8px;max-width:min(520px,calc(100vw - 32px));padding:12px 18px;border-radius:14px;background:var(--sub-color);color:#fff;font-size:0.9375rem;font-weight:600;line-height:1.25rem;box-shadow:0 12px 30px rgba(0,0,0,.22);transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:opacity var(--t-mid) var(--e-out),transform var(--t-mid) var(--e-out)}
