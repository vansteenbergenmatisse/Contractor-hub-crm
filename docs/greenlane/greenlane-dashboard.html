/* GreenLane v2 contractor dashboard: the whole app, opened on the Inbox page. Sample values for a roofer (Northway Roofing, Columbus, OH). */
/* GoHighLevel custom values, folder 02_Branding. The app writes each value into the variable with the name of its key:
   custom_values.main_color -> --main-color
   custom_values.main_hover_color -> --main-hover-color
   custom_values.main_light_color -> --main-light-color
   custom_values.main_background_color -> --main-background-color
   custom_values.main_border_color -> --main-border-color
   custom_values.sub_color -> --sub-color
   custom_values.highlight_color -> --highlight-color
   custom_values.error_color -> --error-color
   custom_values.background_color -> --background-color
   custom_values.section_background_color -> --section-background-color
   custom_values.border_color -> --border-color
   custom_values.text_color -> --text-color
   custom_values.light_text_color -> --light-text-color
   custom_values.text_on_main_color -> --text-on-main-color
   The colors under this line are only the backup for a value that is missing. */
:root:root,.brand-scope{
/* 1. FIELDS: default colors. The hidden list near the top of the file and the script at the end replace each one with your GoHighLevel custom value (folder 02_Branding) when that value is a color. */
--main-color:#2E7D32;
--sub-color:#0F2740;
--highlight-color:#F5A524;
--error-color:#B3261E;
--background-color:#FFFFFF;
--heading-font:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
--body-font:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
--code-font:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;




/* 2. DERIVED COLORS: default colors, calculated from the fields above. The hidden list and the script replace each one with its custom value. */
--main-hover-color:oklch(from var(--main-color) calc(l * 0.8606) calc(c * 0.8473) calc(h - 0.01));
--main-light-color:oklch(from var(--main-color) 0.6433 calc(c * 1.1148) calc(h + 0.22));
--main-background-color:oklch(from var(--main-color) 0.9578 calc(c * 0.1707) calc(h - 6.92));
--main-border-color:oklch(from var(--main-color) 0.8667 calc(c * 0.4750) calc(h - 4.73));
--normal-text-color:oklch(from var(--sub-color) 0.4607 calc(c * 0.6136) calc(h - 1.34));
--light-text-color:oklch(from var(--sub-color) 0.5309 calc(c * 0.5701) calc(h - 3.05));
--border-color:oklch(from var(--sub-color) 0.8831 calc(c * 0.2776) calc(h - 9.68));
--section-background-color:oklch(from var(--sub-color) 0.9680 calc(c * 0.1054) calc(h - 11.66));
--text-on-main-color:oklch(from var(--main-color) clamp(0, calc((0.565 - l) * 1000), 1) 0 h);
--text-on-sub-color:oklch(from var(--sub-color) clamp(0, calc((0.565 - l) * 1000), 1) 0 h);
/* map colors: artwork, they stay the same for every client */
--map-water-color:#B9D8EE;
--map-water-light-color:#CBE3F4;
--map-park-color:#6E9B63;
--map-blue-color:#6E9FC2;
--map-road-color:#E3B04A;
--map-road-light-color:#F9D77E;
/* 3. PART VARIABLES: each one starts as one of the 15 colors. Override one to restyle one part only. */
--button-color:var(--main-color);
--button-hover-color:var(--main-hover-color);
--button-text-color:var(--text-on-main-color);
--button-border-color:var(--button-color);
--button-border-hover-color:var(--button-hover-color);
--button-glow-color:color-mix(in srgb, var(--button-hover-color) 60%, transparent);
--dark-button-color:var(--sub-color);
--dark-button-hover-color:oklch(from var(--sub-color) calc(l * 1.2902) calc(c * 1.2455) calc(h - 0.35));
--dark-button-text-color:var(--text-on-sub-color);
--heading-color:var(--sub-color);
--text-link-color:var(--main-hover-color);
--link-hover-color:var(--text-link-color);
--label-color:var(--main-color);
--label-on-dark-color:var(--main-light-color);
--menu-text-color:var(--sub-color);
--menu-hover-color:var(--main-hover-color);
--menu-underline-color:var(--main-color);
--menu-heading-color:var(--main-color);
--top-bar-color:var(--sub-color);
--top-bar-text-color:var(--text-on-sub-color);
--top-bar-number-color:var(--highlight-color);
--top-bar-link-color:var(--main-light-color);
--trust-bar-color:var(--main-background-color);
--trust-bar-text-color:var(--sub-color);
--trust-bar-icon-color:var(--main-color);
--footer-color:var(--sub-color);
--footer-text-color:var(--text-on-sub-color);
--footer-title-color:var(--highlight-color);
--footer-link-hover-color:var(--highlight-color);
--field-border-color:var(--border-color);
--field-focus-color:var(--main-color);
--focus-outline-color:var(--main-color);
--focus-outline-on-dark-color:var(--highlight-color);
--switch-on-color:var(--main-color);
--selected-color:var(--main-color);
--selected-text-color:var(--text-on-main-color);
--selected-background-color:var(--main-background-color);
--selected-border-color:var(--main-color);
--star-color:var(--highlight-color);
--badge-color:var(--main-background-color);
--badge-text-color:var(--main-color);
--photo-overlay-color:color-mix(in srgb, var(--sub-color) 54%, #000);
--note-background-color:color-mix(in srgb, var(--highlight-color) 14%, var(--background-color));
--note-text-color:var(--sub-color);
}
/* ===== Contractor dashboard, Today page, v2 =====
   Color rules (Apple: a color means one thing, and never color alone):
     main color        = things you can press, the open page, a finished to-do
     amber (highlight) = waiting, always with a clock icon and words
     red (error)       = late money and unread messages, always with an icon or a number
   Text sizes: 12.5px is the smallest on a computer, 13px on a phone (Apple: 10pt and 11pt minimum). Body text is 15px and 16px.

   MOTION RULES (Apple motion, NN/g animation duration, Material duration and easing, Disney's twelve principles, WCAG 2.2.2 and 2.3.3):
     1. Every motion has a job: it answers a press, shows what changed, or shows where something came from. Nothing moves for decoration.
     2. It starts with the press (under 0.1s) and never blocks the next press. Plain CSS, no waiting.
     3. Timing by weight: a press 100ms, a small change 160 to 220ms, a panel 240 to 280ms. Nothing over 400ms.
     4. Slow in, slow out. Things that enter slow down into place (ease-out). Things that leave speed up (ease-in). Never linear.
     5. Exits are quicker than entrances.
     6. Staging: one thing leads. The page comes in from the top down, in order of importance, in well under a second.
     7. Follow-through: the answer comes a beat after the press (the check draws after the row dims; the count ticks last).
     8. Realistic paths: the menu slides in from the side its button is on and leaves the same way. The feedback box grows from its button.
     9. What you see many times a day stays small (a tick, a color change). Nothing loops and nothing flashes.
    10. Motion is optional: with "reduce motion" on, nothing moves. Words and colors still tell the whole story.
    11. The page only comes in once (is-fresh). A fade or a pop only plays on the thing you just pressed (is-last, is-pop, is-new), so nothing plays twice. */
body{margin:0;background:var(--section-background-color)}
.fd-app{
  --fd-page:var(--section-background-color);--fd-card:var(--background-color);--fd-ink:var(--heading-color);--fd-muted:var(--normal-text-color);
  --fd-line:var(--border-color);--fd-hair:color-mix(in srgb,var(--border-color) 50%,var(--background-color));
  --fd-warn-bg:color-mix(in srgb,var(--highlight-color) 20%,var(--background-color));--fd-warn-tx:oklch(from var(--highlight-color) 0.40 calc(c * 0.8) h);
  --fd-bad-bg:color-mix(in srgb,var(--error-color) 10%,var(--background-color));--fd-bad-tx:var(--error-color);
  --fd-shadow:0 1px 2px color-mix(in srgb,var(--heading-color) 5%,transparent),0 10px 30px color-mix(in srgb,var(--heading-color) 6%,transparent);
  /* motion tokens */
  --t-press:100ms;--t-small:180ms;--t-mid:220ms;--t-panel:260ms;--t-exit:180ms;
  --e-out:cubic-bezier(0,0,.2,1);--e-in:cubic-bezier(.4,0,1,1);--e-std:cubic-bezier(.4,0,.2,1);--e-pop:cubic-bezier(.3,1.4,.6,1);
  position:relative;display:grid;grid-template-columns:248px minmax(0,1fr);background:var(--fd-page);color:var(--fd-ink);font-family:var(--body-font);font-size:1.0625rem;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden;line-height:1.5rem;letter-spacing:-0.026em;--apl-lh:1.375rem;--apl-lh-loose:1.5rem;--apl-lh-tight:1.25rem;--weight-regular:400;--weight-medium:400;--weight-semibold:600;--weight-bold:600;--weight-black:600}
.fd-app *,.fd-app *::before,.fd-app *::after{box-sizing:border-box}
.fd-app p,.fd-app h1,.fd-app h2,.fd-app ul,.fd-app ol{margin:0;padding:0}
.fd-app ul,.fd-app ol{list-style:none}
:where(.fd-app) button{font:inherit;color:inherit}   /* no weight of its own, so each button class sets its size */
.fd-app button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.fd-app b{font-weight:var(--weight-bold)}

.fd-app button:focus-visible,.fd-app textarea:focus-visible{outline:3px solid var(--main-color);outline-offset:2px}

/* ---- the side menu: two levels at most, short group labels, a familiar icon per page (Apple sidebars; Jakob's law).
        The open page is the only filled item (Von Restorff). Settings, Send feedback and the owner rest at the bottom. ---- */
.fd-side{display:flex;flex-direction:column;gap:2px;padding:20px 14px 18px;border-right:1px solid var(--fd-line);background:var(--fd-page)}

.fd-bt{display:flex;flex-direction:column;min-width:0}
.fd-bname{font-size:1.0625rem;font-weight:var(--weight-bold);line-height:1.375rem;letter-spacing:-0.026em;--apl-lh:1.375rem;--apl-lh-loose:1.5rem;--apl-lh-tight:1.25rem;--weight-regular:400;--weight-medium:400;--weight-semibold:600;--weight-bold:600;--weight-black:600}

.fd-app .fd-grp{margin:16px 0 4px;padding:0 10px;font-size:0.8125rem;font-weight:var(--weight-bold);text-transform:uppercase;color:var(--fd-muted);line-height:1.125rem;letter-spacing:-0.006em;--apl-lh:1.125rem;--apl-lh-loose:1.25rem;--apl-lh-tight:1rem;--weight-regular:400;--weight-medium:400;--weight-semibold:600;--weight-bold:600;--weight-black:600}
.fd-nav{display:flex;align-items:center;gap:11px;width:100%;min-height:44px;padding:6px 10px;border:0;border-radius:10px;background:none;font-size:0.9375rem;font-weight:var(--weight-medium);text-align:left;transition:background-color var(--t-small) var(--e-std),transform var(--t-press) var(--e-std);line-height:1.25rem;letter-spacing:-0.016em;--apl-lh:1.25rem;--apl-lh-loose:1.375rem;--apl-lh-tight:1.125rem;--weight-regular:400;--weight-medium:400;--weight-semibold:600;--weight-bold:600;--weight-black:600}

.fd-nav.is-on svg{color:inherit}
.fd-badge{margin-left:auto;min-width:22px;padding:0 6px;border-radius:999px;background:var(--error-color);color:var(--background-color);font-size:0.8125rem;font-weight:var(--weight-bold);text-align:center;font-variant-numeric:tabular-nums;line-height:1.125rem;letter-spacing:-0.006em;--apl-lh:1.125rem;--apl-lh-loose:1.25rem;--apl-lh-tight:1rem;--weight-regular:400;--weight-medium:400;--weight-semibold:600;--weight-bold:600;--weight-black:600}
.fd-low{display:flex;flex-direction:column;gap:2px;margin-top:auto;padding-top:24px}
.fd-me{margin-top:12px;padding-top:14px;border-top:1px solid var(--fd-line)}
.fd-av{display:grid;place-items:center;flex:none;width:36px;height:36px;border-radius:50%;background:var(--fd-card);border:1px solid var(--fd-line);font-size:0.8125rem;font-weight:var(--weight-bold);color:var(--fd-ink);line-height:1.125rem;letter-spacing:-0.006em;--apl-lh:1.125rem;--apl-lh-loose:1.25rem;--apl-lh-tight:1rem;--weight-regular:400;--weight-medium:400;--weight-semibold:600;--weight-bold:600;--weight-black:600}
.fd-mname{font-size:0.9375rem;font-weight:var(--weight-semibold);line-height:1.25rem;letter-spacing:-0.016em;--apl-lh:1.25rem;--apl-lh-loose:1.375rem;--apl-lh-tight:1.125rem;--weight-regular:400;--weight-medium:400;--weight-semibold:600;--weight-bold:600;--weight-black:600}
.fd-x,.fd-dsearch,.fd-scrim,.fd-sp{display:none}

/* ---- the page ---- */
.fd-main{min-width:0;padding:20px 36px 36px}
.fd-mtop{display:none}
.fd-top{display:flex;align-items:center;gap:12px;margin-bottom:30px}
.fd-search{display:flex;align-items:center;gap:10px;flex:0 1 420px;height:44px;padding:0 14px;border:1px solid var(--fd-line);border-radius:12px;background:var(--fd-card);color:var(--fd-muted);font-size:0.9375rem;line-height:1.25rem;letter-spacing:-0.016em;--apl-lh:1.25rem;--apl-lh-loose:1.375rem;--apl-lh-tight:1.125rem;--weight-regular:400;--weight-medium:400;--weight-semibold:600;--weight-bold:600;--weight-black:600}

.fd-app .fd-callb svg{color:var(--main-hover-color)}
.fd-cnt{position:absolute;top:-6px;right:-6px;min-width:20px;padding:0 5px;border-radius:999px;background:var(--error-color);color:var(--background-color);font-size:0.8125rem;font-weight:var(--weight-bold);text-align:center;line-height:1.125rem;letter-spacing:-0.006em;--apl-lh:1.125rem;--apl-lh-loose:1.25rem;--apl-lh-tight:1rem;--weight-regular:400;--weight-medium:400;--weight-semibold:600;--weight-bold:600;--weight-black:600}

/* buttons. One filled button on the page: the next to-do (Apple: one or two prominent buttons per view). Same size for every row, so style shows the next one, never size.
   A press pushes the button in a little and lets go at once (anticipation; the answer starts with the press). */
.fd-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border:1px solid var(--main-border-color);border-radius:12px;background:var(--main-background-color);color:var(--main-hover-color);font-size:0.9375rem;font-weight:var(--weight-bold);white-space:nowrap;
  transition:transform var(--t-press) var(--e-std),background-color var(--t-small) var(--e-std),border-color var(--t-small) var(--e-std),color var(--t-small) var(--e-std),box-shadow var(--t-small) var(--e-std);line-height:1.25rem;letter-spacing:-0.016em;--apl-lh:1.25rem;--apl-lh-loose:1.375rem;--apl-lh-tight:1.125rem;--weight-regular:400;--weight-medium:400;--weight-semibold:600;--weight-bold:600;--weight-black:600}
.fd-app .fd-btn.is-plain{border-color:var(--fd-line);background:var(--fd-card);color:var(--fd-ink)}

.fd-link{display:inline-flex;align-items:center;gap:5px;min-height:44px;padding:0 2px;border:0;background:none;font-size:0.9375rem;font-weight:var(--weight-bold);white-space:nowrap;transition:transform var(--t-press) var(--e-std);line-height:1.25rem;letter-spacing:-0.016em;--apl-lh:1.25rem;--apl-lh-loose:1.375rem;--apl-lh-tight:1.125rem;--weight-regular:400;--weight-medium:400;--weight-semibold:600;--weight-bold:600;--weight-black:600}
.fd-app .fd-link{color:var(--main-hover-color)}
.fd-sm{display:none}

/* the page comes in from the top down, in order of importance: 30ms apart, 260ms each, done in about 0.6s (staging; slow out) */
.fd-app.is-fresh .fd-in{animation:fdRise var(--t-panel) var(--e-out) backwards;animation-delay:calc(var(--i,0) * 30ms)}
@keyframes fdRise{from{opacity:0;transform:translateY(8px)}}

.fd-hello{margin:0 0 22px}

.fd-tick-b{animation:fdTickB var(--t-mid) var(--e-out) backwards}
@keyframes fdTickA{from{opacity:0;transform:translateY(.3em)}}
@keyframes fdTickB{from{opacity:0;transform:translateY(.3em)}}

/* ---- four numbers at a glance (about four chunks hold in working memory). Each one opens its page. ---- */
.fd-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}

  transition:transform var(--t-small) var(--e-std),border-color var(--t-small) var(--e-std),box-shadow var(--t-small) var(--e-std);line-height:1.375rem;letter-spacing:-0.026em;--apl-lh:1.375rem;--apl-lh-loose:1.5rem;--apl-lh-tight:1.25rem;--weight-regular:400;--weight-medium:400;--weight-semibold:600;--weight-bold:600;--weight-black:600}
.fd-tl{font-size:0.9375rem;font-weight:var(--weight-semibold);color:var(--fd-muted);line-height:1.25rem;letter-spacing:-0.016em;--apl-lh:1.25rem;--apl-lh-loose:1.375rem;--apl-lh-tight:1.125rem;--weight-regular:400;--weight-medium:400;--weight-semibold:600;--weight-bold:600;--weight-black:600}
.fd-tv{display:flex;align-items:center;gap:7px;font-size:1.0625rem;font-weight:var(--weight-semibold);line-height:1.375rem;letter-spacing:-0.026em;--apl-lh:1.375rem;--apl-lh-loose:1.5rem;--apl-lh-tight:1.25rem;--weight-regular:400;--weight-medium:400;--weight-semibold:600;--weight-bold:600;--weight-black:600}

/* cards: one subject per card (law of common region), the same gap everywhere (proximity) */
.fd-card{min-width:0;border:1px solid var(--fd-line);border-radius:20px;background:var(--fd-card);box-shadow:var(--fd-shadow)}
.fd-main>.fd-card,.fd-two,.fd-money{margin-top:20px}
.fd-ch{display:flex;align-items:center;gap:12px;min-height:44px;padding:18px 24px 8px}
.fd-ct{font-size:1.25rem;font-weight:var(--weight-bold);line-height:1.5625rem;letter-spacing:-0.023em;--apl-lh:1.5625rem;--apl-lh-loose:1.6875rem;--apl-lh-tight:1.4375rem;--weight-regular:400;--weight-medium:400;--weight-semibold:600;--weight-bold:600;--weight-black:600}
.fd-cm{font-size:0.9375rem;font-weight:var(--weight-medium);color:var(--fd-muted);line-height:1.25rem;letter-spacing:-0.016em;--apl-lh:1.25rem;--apl-lh-loose:1.375rem;--apl-lh-tight:1.125rem;--weight-regular:400;--weight-medium:400;--weight-semibold:600;--weight-bold:600;--weight-black:600}
.fd-chl{margin-left:auto}

/* chips: a small icon and words, never color alone */
.fd-chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px 2px 6px;border-radius:999px;background:var(--fd-page);color:var(--fd-muted);font-size:0.8125rem;font-weight:var(--weight-bold);white-space:nowrap;vertical-align:1px;line-height:1.25rem;letter-spacing:-0.006em;--apl-lh:1.125rem;--apl-lh-loose:1.25rem;--apl-lh-tight:1rem;--weight-regular:400;--weight-medium:400;--weight-semibold:600;--weight-bold:600;--weight-black:600}
.fd-chip.is-warn{background:var(--fd-warn-bg);color:var(--fd-warn-tx)}
.fd-chip.is-bad{background:var(--fd-bad-bg);color:var(--fd-bad-tx)}
.fd-chip.is-ok{background:var(--main-background-color);color:var(--main-hover-color)}
.fd-chip.is-next{padding:2px 9px;background:var(--main-color);color:var(--text-on-main-color)}
.fd-chip.is-plain{padding:2px 9px}
.fd-chip.is-plain:has(svg){padding:2px 8px 2px 6px}
.fd-chip.is-off{display:none}
.fd-chip.is-pop{animation:fdPop var(--t-mid) var(--e-pop) backwards}
@keyframes fdPop{from{opacity:0;transform:scale(.8)}}

/* ---- Needs you: only the owner's moves, most urgent first, one button each (Hick; Tesler). A press moves the card; no dragging.
   When a to-do is done: the title is struck through from left to right, the detail line gives way to what the system does next,
   its check draws itself a beat later (follow-through), and the highlight and the filled button move on to the next row. About 0.3s in all. ---- */
.fd-app .fd-rows{padding:0 12px 12px}
.fd-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;column-gap:16px;min-height:68px;padding:10px 12px 10px 14px;border-radius:14px;transition:background-color var(--t-mid) var(--e-std)}
.fd-row+.fd-row{box-shadow:0 -1px 0 var(--fd-hair)}
.fd-rx{min-width:0}
.fd-rt{font-size:1.0625rem;font-weight:var(--weight-medium);line-height:1.375rem;letter-spacing:-0.026em;--apl-lh:1.375rem;--apl-lh-loose:1.5rem;--apl-lh-tight:1.25rem;--weight-regular:400;--weight-medium:400;--weight-semibold:600;--weight-bold:600;--weight-black:600}
.fd-strike{background:linear-gradient(currentColor,currentColor) no-repeat 0 56%/0% 1.5px;transition:background-size var(--t-mid) var(--e-std),color var(--t-small) var(--e-std)}
.fd-rsw{display:grid}
.fd-rs,.fd-rd{grid-area:1/1;align-self:start;min-width:0}
.fd-rs{font-size:0.8125rem;color:var(--fd-muted);transition:opacity var(--t-small) var(--e-out) 60ms;line-height:1.125rem;letter-spacing:-0.006em;--apl-lh:1.125rem;--apl-lh-loose:1.25rem;--apl-lh-tight:1rem;--weight-regular:400;--weight-medium:400;--weight-semibold:600;--weight-bold:600;--weight-black:600}
.fd-rd{display:flex;align-items:flex-start;gap:6px;font-size:0.8125rem;font-weight:var(--weight-semibold);color:var(--main-hover-color);opacity:0;visibility:hidden;transform:translateY(4px);transition:opacity var(--t-press) var(--e-in),transform var(--t-press) var(--e-in),visibility 0s linear var(--t-press);line-height:1.125rem;letter-spacing:-0.006em;--apl-lh:1.125rem;--apl-lh-loose:1.25rem;--apl-lh-tight:1rem;--weight-regular:400;--weight-medium:400;--weight-semibold:600;--weight-bold:600;--weight-black:600}
.fd-rd svg{margin-top:2px}
.fd-rd svg path{stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset var(--t-mid) var(--e-out)}
.fd-amt{font-size:1.0625rem;font-weight:var(--weight-bold);font-variant-numeric:tabular-nums;text-align:right;transition:opacity var(--t-small) var(--e-std);line-height:1.375rem;letter-spacing:-0.026em;--apl-lh:1.375rem;--apl-lh-loose:1.5rem;--apl-lh-tight:1.25rem;--weight-regular:400;--weight-medium:400;--weight-semibold:600;--weight-bold:600;--weight-black:600}
.fd-ra{display:flex;justify-content:flex-end;gap:8px}
.fd-act,.fd-act2{min-width:124px}
.fd-undo{display:none}
.fd-row.is-next{background:color-mix(in srgb,var(--main-background-color) 70%,var(--fd-card))}
.fd-row.is-next+.fd-row,.fd-row.is-next{box-shadow:none}
.fd-app .fd-row.is-next .fd-act{border-color:var(--main-color);background:var(--main-color);color:var(--text-on-main-color);box-shadow:0 6px 16px color-mix(in srgb,var(--main-color) 26%,transparent)}
.fd-row.is-done .fd-strike{background-size:100% 1.5px;color:var(--fd-muted)}
.fd-row.is-done .fd-rt b{font-weight:var(--weight-medium)}
.fd-row.is-done .fd-rs{opacity:0;visibility:hidden;transition:opacity var(--t-press) var(--e-in),visibility 0s linear var(--t-press)}
.fd-row.is-done .fd-rd{opacity:1;visibility:visible;transform:none;transition:opacity var(--t-mid) var(--e-out) 80ms,transform var(--t-mid) var(--e-out) 80ms,visibility 0s}
.fd-row.is-done .fd-rd svg path{stroke-dashoffset:0;transition-delay:160ms}
.fd-row.is-done .fd-amt{opacity:.5}
.fd-row.is-done .fd-act,.fd-row.is-done .fd-act2{display:none}
.fd-row.is-done .fd-undo{display:inline-flex;min-width:124px;min-height:44px;justify-content:center}
.fd-row.is-last.is-done .fd-undo{animation:fdFade var(--t-mid) var(--e-out) 60ms backwards}
.fd-row.is-last:not(.is-done) .fd-ra .fd-btn{animation:fdFade var(--t-small) var(--e-out) backwards}
@keyframes fdFade{from{opacity:0}}

/* ---- Today's calendar and New leads, side by side ---- */
.fd-two{display:grid;grid-template-columns:minmax(0,1.22fr) minmax(0,1fr);gap:20px;align-items:stretch}
/* the stops in time order, tied together by one line (connectedness, continuity). The next stop is the one that stands out. It stays still: the next to-do leads the page (staging). */
.fd-app .fd-stops{padding:2px 24px 14px}
.fd-stop{position:relative;display:grid;grid-template-columns:78px 24px minmax(0,1fr) auto;column-gap:12px;align-items:center;min-height:72px;padding:10px 0}
.fd-stop::before{content:"";position:absolute;left:101px;top:0;bottom:0;width:2px;background:var(--fd-hair)}
.fd-stop:first-child::before{top:50%}
.fd-stop:last-child::before{bottom:50%}
.fd-time{font-size:0.9375rem;font-weight:var(--weight-bold);font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.25rem;letter-spacing:-0.016em;--apl-lh:1.25rem;--apl-lh-loose:1.375rem;--apl-lh-tight:1.125rem;--weight-regular:400;--weight-medium:400;--weight-semibold:600;--weight-bold:600;--weight-black:600}
.fd-node{position:relative;z-index:1;display:block;width:24px;height:24px;border:2px solid var(--fd-line);border-radius:50%;background:var(--fd-card)}
.fd-stop.is-next .fd-node{border:7px solid var(--main-color)}
.fd-stop.is-past .fd-node{border-color:var(--fd-hair);background:var(--fd-hair)}
.fd-stop.is-past .fd-time,.fd-stop.is-past .fd-st b{color:var(--fd-muted)}
.fd-sx{min-width:0}
.fd-st{font-size:1.0625rem;line-height:1.375rem;letter-spacing:-0.026em;--apl-lh:1.375rem;--apl-lh-loose:1.5rem;--apl-lh-tight:1.25rem;--weight-regular:400;--weight-medium:400;--weight-semibold:600;--weight-bold:600;--weight-black:600}
.fd-ss{margin-top:1px;font-size:0.8125rem;color:var(--fd-muted);line-height:1.125rem;letter-spacing:-0.006em;--apl-lh:1.125rem;--apl-lh-loose:1.25rem;--apl-lh-tight:1rem;--weight-regular:400;--weight-medium:400;--weight-semibold:600;--weight-bold:600;--weight-black:600}
/* the kind of stop: a Job (paid work) is a filled dark tag in the brand's second color, an Estimate (a visit to price work) is a light tag. Dark against light, plus the word, so it never rests on color alone. */
.fd-kind{display:inline-block;margin-right:4px;padding:0 7px;border:1px solid var(--fd-line);border-radius:6px;font-size:0.8125rem;font-weight:var(--weight-bold);color:var(--fd-ink);background:var(--fd-card);line-height:1.125rem;letter-spacing:-0.006em;--apl-lh:1.125rem;--apl-lh-loose:1.25rem;--apl-lh-tight:1rem;--weight-regular:400;--weight-medium:400;--weight-semibold:600;--weight-bold:600;--weight-black:600}
.fd-kind.is-estimate{border-color:var(--fd-line);background:var(--fd-page);color:var(--fd-ink)}
.fd-kind.is-job{border-color:var(--sub-color);background:var(--sub-color);color:var(--text-on-sub-color)}
.fd-dir{min-height:44px;padding:0 14px;border:1px solid var(--fd-line);border-radius:12px;background:var(--fd-card);transition:transform var(--t-press) var(--e-std),background-color var(--t-small) var(--e-std)}
.fd-app .fd-dir{color:var(--fd-ink)}
/* New leads: a segmented control like the one in iOS. The white thumb slides to the side you press; the two lists share one spot and cross-fade. */
.fd-seg{position:relative;display:grid;grid-template-columns:1fr 1fr;margin-left:auto;padding:3px;border:1px solid var(--fd-hair);border-radius:11px;background:var(--fd-page)}
.fd-thumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:8px;background:var(--fd-card);box-shadow:0 1px 3px color-mix(in srgb,var(--heading-color) 16%,transparent);transition:transform var(--t-mid) var(--e-std)}
.fd-thumb.is-week{transform:translateX(100%)}
.fd-sb{position:relative;z-index:1;min-height:44px;padding:0 14px;border:0;border-radius:8px;background:none;font-size:0.9375rem;font-weight:var(--weight-semibold);transition:color var(--t-small) var(--e-std),transform var(--t-press) var(--e-std);line-height:1.25rem;letter-spacing:-0.016em;--apl-lh:1.25rem;--apl-lh-loose:1.375rem;--apl-lh-tight:1.125rem;--weight-regular:400;--weight-medium:400;--weight-semibold:600;--weight-bold:600;--weight-black:600}
.fd-app .fd-sb{color:var(--fd-muted)}
.fd-app .fd-sb.is-on{color:var(--fd-ink)}
.fd-panes{display:grid}
.fd-pane{grid-area:1/1;min-width:0;transition:opacity var(--t-small) var(--e-out) 60ms}
.fd-pane.is-off{opacity:0;visibility:hidden;transition:opacity var(--t-press) var(--e-in),visibility 0s linear var(--t-press)}
.fd-app .fd-big{display:flex;align-items:baseline;gap:8px;padding:0 24px 8px;font-size:1.0625rem;font-weight:var(--weight-semibold);line-height:1.375rem;letter-spacing:-0.026em;--apl-lh:1.375rem;--apl-lh-loose:1.5rem;--apl-lh-tight:1.25rem;--weight-regular:400;--weight-medium:400;--weight-semibold:600;--weight-bold:600;--weight-black:600}
.fd-big b{font-size:1.75rem;font-weight:var(--weight-black);font-variant-numeric:tabular-nums;line-height:2.125rem;letter-spacing:0.014em;--apl-lh:2.125rem;--apl-lh-loose:2.25rem;--apl-lh-tight:2rem;--weight-regular:400;--weight-medium:400;--weight-semibold:700;--weight-bold:700;--weight-black:700}
.fd-app .fd-leads{padding:0 24px 10px}
.fd-lead{display:grid;grid-template-columns:36px minmax(0,1fr) auto;align-items:center;column-gap:12px;min-height:60px;padding:8px 0;border-top:1px solid var(--fd-hair)}
.fd-lead .fd-av{background:var(--fd-page)}
.fd-lt{font-size:1.0625rem;line-height:1.375rem;letter-spacing:-0.026em;--apl-lh:1.375rem;--apl-lh-loose:1.5rem;--apl-lh-tight:1.25rem;--weight-regular:400;--weight-medium:400;--weight-semibold:600;--weight-bold:600;--weight-black:600}
.fd-ls{font-size:0.8125rem;color:var(--fd-muted);line-height:1.125rem;letter-spacing:-0.006em;--apl-lh:1.125rem;--apl-lh-loose:1.25rem;--apl-lh-tight:1rem;--weight-regular:400;--weight-medium:400;--weight-semibold:600;--weight-bold:600;--weight-black:600}

/* ---- the pipeline: the eleven stages in four groups (chunking), left to right in the order work moves. A count each, no dollar amounts. The groups carry the menu's names. ---- */
.fd-pipe{display:grid;grid-template-columns:5fr 3fr 1fr 2fr;gap:14px;padding:0 24px 22px}
.fd-pg{display:flex;flex-direction:column;min-width:0}
.fd-pgh{display:none}
.fd-pfold{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
.fd-app .fd-pg .fd-grp{margin:6px 0 8px;padding:0 2px}
.fd-pcs{flex:1 1 auto;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);border:1px solid var(--fd-hair);border-radius:14px;background:var(--fd-page);overflow:hidden}
.fd-pc{position:relative;display:flex;flex-direction:column;align-items:flex-start;min-width:0;padding:12px 6px 12px 14px;border:0;border-radius:0;background:none;font-size:1.0625rem;text-align:left;transition:background-color var(--t-small) var(--e-std);line-height:1.375rem;letter-spacing:-0.026em;--apl-lh:1.375rem;--apl-lh-loose:1.5rem;--apl-lh-tight:1.25rem;--weight-regular:400;--weight-medium:400;--weight-semibold:600;--weight-bold:600;--weight-black:600}
.fd-pc+.fd-pc{box-shadow:-1px 0 0 var(--fd-hair)}
.fd-pc+.fd-pc::before{content:"";position:absolute;left:-6px;top:50%;width:10px;height:10px;margin-top:-5px;border-top:1px solid var(--fd-line);border-right:1px solid var(--fd-line);background:var(--fd-page);transform:rotate(45deg)}
.fd-pn{font-size:1.375rem;font-weight:var(--weight-black);font-variant-numeric:tabular-nums;line-height:1.75rem;letter-spacing:-0.012em;--apl-lh:1.75rem;--apl-lh-loose:1.875rem;--apl-lh-tight:1.625rem;--weight-regular:400;--weight-medium:400;--weight-semibold:700;--weight-bold:700;--weight-black:700}
.fd-pl{min-height:2.5em;margin-top:2px;font-size:0.8125rem;font-weight:var(--weight-bold);line-height:1.125rem;letter-spacing:-0.006em;--apl-lh:1.125rem;--apl-lh-loose:1.25rem;--apl-lh-tight:1rem;--weight-regular:400;--weight-medium:400;--weight-semibold:600;--weight-bold:600;--weight-black:600}
.fd-pg.is-later .fd-pn,.fd-pg.is-later .fd-pl{color:var(--fd-muted)}
.fd-pg.is-later .fd-pc+.fd-pc::before{display:none}

/* ---- money: three cards. The filled one opens the Money pages, so the brand color still means "you can press this". Its bars grow from the floor once (length is the easiest thing to compare). ---- */
.fd-money{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.fd-money .fd-card{display:flex;flex-direction:column;padding:20px 24px}
.fd-mh{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--fd-muted)}
.fd-ml{font-size:0.9375rem;font-weight:var(--weight-semibold);color:var(--fd-muted);line-height:1.25rem;letter-spacing:-0.016em;--apl-lh:1.25rem;--apl-lh-loose:1.375rem;--apl-lh-tight:1.125rem;--weight-regular:400;--weight-medium:400;--weight-semibold:600;--weight-bold:600;--weight-black:600}
.fd-app .fd-mv{margin-top:4px;font-size:2.125rem;font-weight:var(--weight-black);font-variant-numeric:tabular-nums;line-height:2.5625rem;letter-spacing:0.012em;--apl-lh:2.5625rem;--apl-lh-loose:2.6875rem;--apl-lh-tight:2.4375rem;--weight-regular:400;--weight-medium:400;--weight-semibold:700;--weight-bold:700;--weight-black:700}
.fd-app .fd-mini{margin-top:12px}
.fd-mini li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;column-gap:10px;min-height:40px;border-top:1px solid var(--fd-hair);font-size:0.9375rem;line-height:1.25rem;letter-spacing:-0.016em;--apl-lh:1.25rem;--apl-lh-loose:1.375rem;--apl-lh-tight:1.125rem;--weight-regular:400;--weight-medium:400;--weight-semibold:600;--weight-bold:600;--weight-black:600}
.fd-mn{overflow:hidden;font-weight:var(--weight-semibold);text-overflow:ellipsis;white-space:nowrap}
.fd-mq{font-size:0.8125rem;color:var(--fd-muted);white-space:nowrap;line-height:1.125rem;letter-spacing:-0.006em;--apl-lh:1.125rem;--apl-lh-loose:1.25rem;--apl-lh-tight:1rem;--weight-regular:400;--weight-medium:400;--weight-semibold:600;--weight-bold:600;--weight-black:600}
.fd-ma{min-width:62px;font-weight:var(--weight-bold);font-variant-numeric:tabular-nums;text-align:right}
.fd-app .fd-mf{margin-top:auto;padding-top:12px;border-top:1px solid var(--fd-hair);font-size:0.8125rem;font-weight:var(--weight-medium);color:var(--fd-muted);line-height:1.125rem;letter-spacing:-0.006em;--apl-lh:1.125rem;--apl-lh-loose:1.25rem;--apl-lh-tight:1rem;--weight-regular:400;--weight-medium:400;--weight-semibold:600;--weight-bold:600;--weight-black:600}
.fd-fill{border-color:var(--main-color);background:var(--main-color);color:var(--text-on-main-color);box-shadow:0 14px 34px color-mix(in srgb,var(--main-color) 30%,transparent)}
.fd-fill .fd-mh,.fd-fill .fd-ml{color:var(--text-on-main-color)}
.fd-app .fd-up{display:inline-flex;align-items:center;align-self:flex-start;gap:6px;margin-top:8px;padding:3px 10px;border-radius:999px;background:color-mix(in srgb,#000 18%,transparent);font-size:0.8125rem;font-weight:var(--weight-bold);line-height:1.125rem;letter-spacing:-0.006em;--apl-lh:1.125rem;--apl-lh-loose:1.25rem;--apl-lh-tight:1rem;--weight-regular:400;--weight-medium:400;--weight-semibold:600;--weight-bold:600;--weight-black:600}
.fd-bars{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;flex:1 1 auto;min-height:112px;margin-top:16px}
.fd-bb{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:6px;justify-items:center}
.fd-bb i{align-self:end;display:block;width:100%;border-radius:8px 8px 4px 4px;background:color-mix(in srgb,var(--text-on-main-color) 30%,transparent);transform-origin:50% 100%}
.fd-app.is-fresh .fd-bb i{animation:fdGrow 320ms var(--e-out) backwards;animation-delay:calc(300ms + var(--b,0) * 30ms)}
.fd-bb.is-on i{background:var(--text-on-main-color)}
.fd-bb em{font-style:normal;font-size:0.8125rem;font-weight:var(--weight-semibold);white-space:nowrap;line-height:1.125rem;letter-spacing:-0.006em;--apl-lh:1.125rem;--apl-lh-loose:1.25rem;--apl-lh-tight:1rem;--weight-regular:400;--weight-medium:400;--weight-semibold:600;--weight-bold:600;--weight-black:600}
@keyframes fdGrow{from{transform:scaleY(.04)}}

.fd-tabs{display:none}

/* ---- Send feedback: one box and one button. It grows out of the button you pressed and shrinks back to it; it leaves quicker than it came. ---- */
.fd-fb{position:absolute;z-index:40;left:16px;bottom:84px;width:344px;padding:18px;border:1px solid var(--fd-line);border-radius:18px;background:var(--fd-card);box-shadow:0 2px 6px color-mix(in srgb,var(--heading-color) 8%,transparent),0 24px 60px color-mix(in srgb,var(--heading-color) 22%,transparent);
  opacity:0;visibility:hidden;transform:translateY(10px) scale(.96);transform-origin:20% 100%;transition:opacity var(--t-exit) var(--e-in),transform var(--t-exit) var(--e-in),visibility 0s linear var(--t-exit)}
.fd-fb.is-open{opacity:1;visibility:visible;transform:none;transition:opacity var(--t-panel) var(--e-out),transform var(--t-panel) var(--e-out),visibility 0s}
.fd-fbt{font-size:1.0625rem;font-weight:var(--weight-bold);line-height:1.375rem;letter-spacing:-0.026em;--apl-lh:1.375rem;--apl-lh-loose:1.5rem;--apl-lh-tight:1.25rem;--weight-regular:400;--weight-medium:400;--weight-semibold:600;--weight-bold:600;--weight-black:600}
.fd-app .fd-fbs{margin-top:2px;font-size:0.9375rem;color:var(--fd-muted);line-height:1.25rem;letter-spacing:-0.016em;--apl-lh:1.25rem;--apl-lh-loose:1.375rem;--apl-lh-tight:1.125rem;--weight-regular:400;--weight-medium:400;--weight-semibold:600;--weight-bold:600;--weight-black:600}

/* ===== Pipeline page: a Jira-style board, second version =====
   What each choice is for:
   - All 11 stages show by name with their count, always (recognition over recall: nobody should have to remember that Job Done hides under "Delivery").
   - The stages sit in four groups with a label: Sales, Delivery, Money, Later (chunking: 4 groups read quicker than 11 loose things).
   - Computer: the stage map is the same strip as on Today (consistency). Press a stage: the board shows its group, and that column is marked.
   - Phone: one thing per screen. First the list of stages, then one stage. The bar on top steps to the next stage or back to the list,
     and it stays put while you scroll (big targets in one fixed place: Fitts).
   - A card is one customer. Its first button drops it into its next logical stage; its second button marks the job done. Both move the card.
     Buttons, never a free drag, because a card may only make the moves the pipeline allows (error prevention; the system carries the rules).
   - The answer shows where you pressed: the card leaves a note in its old place (where it went, what the system does next, Show, Undo).
     The card itself lands on top of its new stage with a ring, and it carries Undo too (visibility of system status; user control).

  transition:background-color var(--t-small) var(--e-std),border-color var(--t-small) var(--e-std),box-shadow var(--t-small) var(--e-std),transform var(--t-press) var(--e-std)}

/* ===== Inbox page =====
   What each choice is for:
   - One list for every channel. Every row carries a label that says where it came from: Call, Text, Email, Web form, Facebook, Instagram.
     The label is a word with a plain icon, never a brand logo or a color alone. The reply box has its own visible label that names the channel the answer goes out on
     (a label above the field, never a placeholder alone: Baymard, web.dev).
   - Who waits on you comes first, with how long: an amber chip with a clock (the same "waiting" look as on Today). Their names are bold.
   - The system's own messages sit in the thread with "Sent by the system", so the owner sees what went out in his name (visibility of system status).
   - Computer: list and conversation side by side, like every mail and chat app (Jakob: people already know this layout).
   - Phone: one thing per screen. The list, then the conversation. The bar on top goes back and stays put; the reply box stays at the bottom, in thumb reach (Fitts).
   - One filled button on the page: Send. A quick reply fills the box, it never sends on its own (error prevention).
   Motion follows the MOTION RULES of the Today page. */
.fd-badge.is-off{display:none}
.fd-ixg{display:grid;grid-template-columns:376px minmax(0,1fr);gap:16px;height:800px}
.fd-il,.fd-th{display:flex;flex-direction:column;min-width:0;min-height:0;border:1px solid var(--fd-line);border-radius:20px;background:var(--fd-card);box-shadow:var(--fd-shadow);overflow:hidden}

/* All / Needs reply: the white thumb slides to the one in view (like Today / This week on the Today page) */
.fd-if{position:relative;display:grid;grid-template-columns:1fr 1fr;flex:none;margin:12px 12px 8px;padding:3px;border:1px solid var(--fd-hair);border-radius:11px;background:var(--fd-page)}
.fd-ift{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:8px;background:var(--fd-card);box-shadow:0 1px 3px color-mix(in srgb,var(--heading-color) 16%,transparent);transition:transform var(--t-mid) var(--e-std)}
.fd-ift.is-need{transform:translateX(100%)}
.fd-ifb{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:7px;min-height:36px;padding:0 8px;border:0;border-radius:8px;background:none;font-size:0.9375rem;font-weight:var(--weight-semibold);transition:color var(--t-small) var(--e-std),transform var(--t-press) var(--e-std);line-height:1.25rem;letter-spacing:-0.016em;--apl-lh:1.25rem;--apl-lh-loose:1.375rem;--apl-lh-tight:1.125rem;--weight-regular:400;--weight-medium:400;--weight-semibold:600;--weight-bold:600;--weight-black:600}
.fd-app .fd-ifb{color:var(--fd-muted)}
.fd-app .fd-ifb.is-on{color:var(--fd-ink);font-weight:var(--weight-bold)}
.fd-app .fd-ifb:active{transform:scale(.97)}
.fd-ifn{display:inline-block;min-width:22px;padding:0 6px;border-radius:999px;background:var(--fd-card);border:1px solid var(--fd-hair);font-size:0.8125rem;font-weight:var(--weight-bold);text-align:center;font-variant-numeric:tabular-nums;line-height:1.125rem;letter-spacing:-0.006em;--apl-lh:1.125rem;--apl-lh-loose:1.25rem;--apl-lh-tight:1rem;--weight-regular:400;--weight-medium:400;--weight-semibold:600;--weight-bold:600;--weight-black:600}
.fd-app .fd-ifn{color:var(--fd-ink)}
.fd-app .fd-ifn.is-hot{border-color:var(--error-color);background:var(--error-color);color:var(--background-color)}

/* the rows */
.fd-crs{flex:1 1 auto;min-height:0;overflow-y:auto;padding:0 8px 8px;scrollbar-width:thin}
.fd-cr{display:flex;gap:10px;width:100%;padding:10px;border:0;border-radius:12px;background:none;text-align:left;transition:background-color var(--t-small) var(--e-std)}
.fd-app .fd-cr{color:var(--fd-ink)}
.fd-cr.is-off{display:none}
.fd-cr.is-sel{background:var(--main-background-color)}

.fd-cr2{display:flex;align-items:center;gap:6px;min-width:0;margin-top:2px;font-size:0.8125rem;color:var(--fd-muted);line-height:1.125rem;letter-spacing:-0.006em;--apl-lh:1.125rem;--apl-lh-loose:1.25rem;--apl-lh-tight:1rem;--weight-regular:400;--weight-medium:400;--weight-semibold:600;--weight-bold:600;--weight-black:600}
.fd-csn{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* where it came from: a word with a plain icon, the same on every row (similarity), never a color or a logo alone */
.fd-src{display:inline-flex;align-items:center;gap:4px;flex:none;padding:1px 7px 1px 5px;border:1px solid var(--fd-line);border-radius:6px;background:var(--fd-card);font-size:0.8125rem;font-weight:var(--weight-bold);white-space:nowrap;line-height:1.25rem;letter-spacing:-0.006em;--apl-lh:1.125rem;--apl-lh-loose:1.25rem;--apl-lh-tight:1rem;--weight-regular:400;--weight-medium:400;--weight-semibold:600;--weight-bold:600;--weight-black:600}

.fd-src svg{box-sizing:content-box;flex:none;padding:2px;border-radius:4px;background:var(--sub-color);color:var(--text-on-main-color)}
.fd-src{padding-left:2px}

.fd-app .fd-none.is-off{display:none}

/* the open conversation */
.fd-thh{display:flex;align-items:center;gap:12px;flex:none;padding:14px 18px;border-bottom:1px solid var(--fd-hair)}
.fd-tback{display:none}
.fd-thh .fd-av{width:42px;height:42px;background:var(--fd-page)}
.fd-thx{flex:1 1 auto;min-width:0}
.fd-app .fd-thn{font-size:1.0625rem;font-weight:var(--weight-bold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.375rem;letter-spacing:-0.026em;--apl-lh:1.375rem;--apl-lh-loose:1.5rem;--apl-lh-tight:1.25rem;--weight-regular:400;--weight-medium:400;--weight-semibold:600;--weight-bold:600;--weight-black:600}

.fd-tha{display:flex;gap:8px;flex:none}
.fd-tm{flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:16px 18px;scrollbar-width:thin}
.fd-tm.is-sw-a{animation:fdThA var(--t-small) var(--e-out) backwards}

/* ===== Calendar page =====
   What each choice is for:
   - Two kinds of stop and each looks its own way everywhere: an estimate is light, a job is navy (the same two tags as on Today).
     Every block also says "Estimate" or "Job" in words, so nobody has to tell them apart by color alone.
   - Computer: a week grid, Sunday first, like the calendar people already use (Jakob). What is over is quiet; today has a marked column and a line at "now".
   - Press a stop and its details open right there: where, when, the reminder status, and the four things an owner does with a stop
     (Directions, Call, Text, Reschedule). Nothing else (Hick: few choices, quick choice).
   - Reschedule offers three free times, never a free drag: the system knows what is free (error prevention). The stop moves, the view follows it, Undo sits next to it.
   - Phone: one day at a time. The seven days on top are the buttons; a dot marks a day with stops. Cards show the address without a tap, because that is what he needs in the truck.
   Motion follows the MOTION RULES of the Today page. */

/* the bar: step, Today, what is in view, what the colors mean, Week / Day */

.fd-csb{position:relative;z-index:1;min-height:44px;border:0;border-radius:8px;background:none;font-size:0.9375rem;font-weight:var(--weight-semibold);transition:color var(--t-small) var(--e-std),transform var(--t-press) var(--e-std);line-height:1.25rem;letter-spacing:-0.016em;--apl-lh:1.25rem;--apl-lh-loose:1.375rem;--apl-lh-tight:1.125rem;--weight-regular:400;--weight-medium:400;--weight-semibold:600;--weight-bold:600;--weight-black:600}

  .fd-kt .fd-kcal,.fd-kt .fd-klost{position:relative;width:32px;min-width:32px;height:32px}

}
/* a short text button (Undo) is never narrower than 44 pt */
.fd-app .fd-link,.fd-app .fd-btn{min-width:44px}
/* readable width: a paragraph stops at the width iOS gives a column of text at the default text size (672 pt) */

.fd-app .fd-kn,.fd-app .fd-ks,.fd-app .fd-kad span,.fd-app .fd-ka span,.fd-app .fd-stt,.fd-app .fd-sta span,.fd-app .fd-km > span,.fd-app .fd-khn{white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere}

.fx-stq{display:flex;align-items:center;gap:8px;height:44px;margin:0 0 12px;padding:0 12px;border-radius:10px;background:color-mix(in srgb,var(--sub-color) 8%,var(--fd-card));color:var(--fd-muted)}

.fd-app .fx-stin{flex:1 1 auto;min-width:0;height:44px;margin:0;padding:0;border:0;background:none;color:var(--fd-ink);font-family:var(--body-font);font-size:1.0625rem;line-height:1.375rem;letter-spacing:-0.026em;outline:none}
.fx-stl{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.fd-app .fx-stni{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:6px 10px;border:0;border-radius:10px;background:none;color:var(--fd-ink);text-align:left;font-family:var(--body-font);font-size:1.0625rem;line-height:1.375rem;letter-spacing:-0.026em;font-weight:400;cursor:pointer}
.fd-app .fx-stni:hover{background:color-mix(in srgb,var(--sub-color) 6%,transparent)}
.fd-app .fx-stni.is-on{background:color-mix(in srgb,var(--main-color) 14%,transparent);font-weight:600}
.fd-app .fx-stni:focus-visible{outline:3px solid var(--main-color);outline-offset:1px}
.fx-sti{display:grid;place-items:center;flex:none;width:30px;height:30px;border-radius:8px;background:var(--main-color);color:var(--text-on-main-color)}
.fx-stt{flex:1 1 auto;min-width:0}
.fd-app .fx-stch{flex:none;color:var(--fd-muted);display:none}
.fd-app .fx-stback{display:none}
.fd-app .fx-stnone{display:none;max-width:none;margin:24px 0;font-size:1.0625rem;line-height:1.375rem;letter-spacing:-0.026em;font-weight:400;color:var(--fd-muted);text-align:center}
.fx-stbody{display:flex;flex-direction:column;gap:16px;min-width:0}
.fx-stbody > *{margin-top:0}
.fd-view[data-q="1"] #fd-st-col{display:grid}
.fd-view[data-sec="choice"][data-q="0"] .fd-st2,.fd-view[data-sec="soon"][data-q="0"] .fd-st2{grid-template-columns:minmax(0,1fr)}
.fd-view[data-sec="biz"][data-q="0"] .fx-stbody > [aria-labelledby="fd-st-2"],
.fd-view[data-sec="biz"][data-q="0"] .fx-stbody > [aria-labelledby="fd-st-4"],
.fd-view[data-sec="biz"][data-q="0"] .fx-stbody > .fd-st2,
.fd-view[data-sec="colors"][data-q="0"] .fx-stbody > [aria-labelledby="fd-st-1"],
.fd-view[data-sec="colors"][data-q="0"] .fx-stbody > [aria-labelledby="fd-st-4"],
.fd-view[data-sec="colors"][data-q="0"] .fx-stbody > .fd-st2,
.fd-view[data-sec="conn"][data-q="0"] .fx-stbody > [aria-labelledby="fd-st-1"],
.fd-view[data-sec="conn"][data-q="0"] .fx-stbody > [aria-labelledby="fd-st-2"],
.fd-view[data-sec="conn"][data-q="0"] .fx-stbody > .fd-cvsv,
.fd-view[data-sec="conn"][data-q="0"] .fx-stbody > .fd-st2,
.fd-view[data-sec="choice"][data-q="0"] .fx-stbody > [aria-labelledby="fd-st-1"],
.fd-view[data-sec="choice"][data-q="0"] .fx-stbody > [aria-labelledby="fd-st-2"],
.fd-view[data-sec="choice"][data-q="0"] .fx-stbody > .fd-cvsv,
.fd-view[data-sec="choice"][data-q="0"] .fx-stbody > [aria-labelledby="fd-st-4"],
.fd-view[data-sec="choice"][data-q="0"] .fx-stbody [aria-labelledby="fd-st-5"],
.fd-view[data-sec="soon"][data-q="0"] .fx-stbody > [aria-labelledby="fd-st-1"],
.fd-view[data-sec="soon"][data-q="0"] .fx-stbody > [aria-labelledby="fd-st-2"],
.fd-view[data-sec="soon"][data-q="0"] .fx-stbody > .fd-cvsv,
.fd-view[data-sec="soon"][data-q="0"] .fx-stbody > [aria-labelledby="fd-st-4"],

@media (min-width: 1024px){
  .fd-view[data-sec]:not(.fd-hid){display:grid;grid-template-columns:240px minmax(0,1fr);column-gap:32px;align-items:start}
  .fd-view[data-sec] > *{grid-column:2;min-width:0}
  .fd-view[data-sec] > .fd-phd{grid-column:1 / -1}
  .fd-view[data-sec] > .fx-stnav{grid-column:1;grid-row:2 / span 2;align-self:start;position:sticky;top:16px;margin:0}
  .fd-view[data-sec] > .fd-stout{justify-self:start}
}
@media (max-width: 1023px){
  .fx-stl{gap:0;border-radius:12px;background:var(--fd-card);overflow:hidden}
  .fd-app .fx-stni{min-height:52px;padding:8px 12px;border-radius:0}
  .fx-stl > li + li .fx-stni{box-shadow:inset 54px .5px 0 -54px var(--fd-card),inset 0 .5px 0 var(--fd-hair)}
  .fd-app .fx-stni.is-on{background:none;font-weight:400}
  .fd-app .fx-stch{display:block}
  .fd-view[data-open="0"][data-q="0"] .fx-stbody,.fd-view[data-open="0"][data-q="0"] > .fd-stout{display:none}
  .fd-view[data-open="1"][data-q="0"] > .fx-stnav,.fd-view[data-open="1"][data-q="0"] > .fd-phd{display:none}
  .fd-app .fd-view[data-open="1"][data-q="0"] > .fx-stback{display:inline-flex;align-items:center;gap:4px;min-height:44px;margin:4px 0 4px -6px}
  .fd-view[data-q="1"] .fx-stl{display:none}
}
/* 4 + 5 phone bars: the top bar is clear at the top of a page and turns to glass once the page scrolls under it */
.fx-mttl{display:none}
.fx-tcap{display:contents}
.fx-tsrch{display:none}
@media (max-width: 1023px){
  .fd-app .fd-mtop{position:sticky;background:var(--fd-page);-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none;transition:background-color var(--t-small) var(--e-std),box-shadow var(--t-small) var(--e-std)}
  .fd-app .fd-mtop.is-sc{background:color-mix(in srgb,var(--fd-page) 72%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 color-mix(in srgb,var(--sub-color) 20%,transparent)}
  .fd-app .fd-mtop .fd-bname{transition:opacity var(--t-small) var(--e-std)}
  .fd-app .fd-mtop.is-ttl .fd-bname{opacity:0}
  .fd-app .fx-mttl{position:absolute;left:50%;top:50%;display:block;max-width:44%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;transform:translate(-50%,-30%);opacity:0;pointer-events:none;font-size:1.0625rem;line-height:1.375rem;letter-spacing:-0.026em;font-weight:600;color:var(--fd-ink);transition:opacity var(--t-small) var(--e-std),transform var(--t-small) var(--e-std)}
  .fd-app .fd-mtop.is-ttl .fx-mttl{opacity:1;transform:translate(-50%,-50%)}
  /* the tab bar floats as a glass capsule over the page, with Search as its own round button (iOS 26 tab bar) */
  .fx-tcap{position:absolute;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;align-items:stretch;gap:8px;pointer-events:none}
  .fx-tcap.fd-hid{display:none}
  .fd-app .fx-tcap .fd-tabs{flex:1 1 auto;padding:4px;border:.5px solid color-mix(in srgb,var(--sub-color) 14%,transparent);border-radius:32px;background:color-mix(in srgb,var(--fd-card) 74%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 8px 28px color-mix(in srgb,var(--heading-color) 16%,transparent);pointer-events:auto}
  .fd-app .fx-tcap .fd-tab{min-height:54px;border-radius:28px}
  .fd-app .fx-tcap .fd-tab.is-on{background:color-mix(in srgb,var(--main-color) 14%,transparent)}
  .fd-app .fx-tsrch{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;flex:none;width:64px;padding:0;border:.5px solid color-mix(in srgb,var(--sub-color) 14%,transparent);border-radius:32px;background:color-mix(in srgb,var(--fd-card) 74%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 8px 28px color-mix(in srgb,var(--heading-color) 16%,transparent);color:var(--fd-muted);font-family:var(--body-font);font-size:0.8125rem;line-height:1.125rem;letter-spacing:-0.006em;font-weight:600;cursor:pointer;pointer-events:auto}
  .fd-app .fx-tsrch:focus-visible{outline:3px solid var(--main-color);outline-offset:2px}
  .fd-app .fd-main.fx-cap{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
  /* 3 sheets slide up from the bottom: a grabber, about half the screen, more room when you pull it up */
  .fd-app .fd-cf:not(.is-off){position:fixed;inset:0;z-index:60;align-items:flex-end;justify-content:stretch;padding:0;border-radius:0}
  .fd-app .fd-cf .fd-cfb,.fd-app .fd-dg.is-view .fd-cfb{position:relative;top:auto;width:100%;height:auto;max-height:56vh;overflow:auto;overscroll-behavior:contain;padding:30px 16px calc(16px + env(safe-area-inset-bottom,0px));border:0;border-radius:20px 20px 0 0;box-shadow:0 -8px 40px color-mix(in srgb,var(--heading-color) 20%,transparent);animation:fxUp 260ms var(--e-out)}
  .fd-app .fd-dg.is-view .fd-cfb{height:92vh;max-height:92vh}
  .fd-app .fd-cf .fd-cfb::before,.fd-app .fd-cdet.is-on::before{content:"";position:absolute;top:8px;left:50%;width:36px;height:5px;margin-left:-18px;border-radius:3px;background:color-mix(in srgb,var(--sub-color) 28%,transparent)}
  .fd-app .fd-cdet.is-on{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:58;width:auto;max-height:56vh;overflow:auto;overscroll-behavior:contain;margin:0;padding:30px 16px calc(16px + env(safe-area-inset-bottom,0px));border:0;border-radius:20px 20px 0 0;box-shadow:0 -8px 40px color-mix(in srgb,var(--heading-color) 20%,transparent);animation:fxUp 260ms var(--e-out)}
  /* the stop sheet says which stop it is and has a close button, because it no longer sits under the stop */
  .fd-app .fd-cal .fd-cdet.is-on .fd-dh{display:flex}
  .fd-app .fd-cal .fd-cdet.is-on .fd-dn,.fd-app .fd-cal .fd-cdet.is-on .fd-ds{display:block}
  .fd-app .fd-cal .fd-cdet.is-on .fd-dl2{display:flex}
  .fd-app .fd-cal .fd-cdet.is-on .fd-dx{display:grid}
  .fd-app .fd-cal .fd-cdet.is-on .fd-dl{margin-top:8px}
  .fd-app .fd-cf .fd-cfa .fd-btn{width:100%}
  .fd-app .fd-cf .fd-cfa{flex-direction:column;align-items:stretch}
  .fd-cal .fx-nowl{display:none}
  .fd-app .fd-cr,.fd-app .fd-lst > .fd-rw,.fd-app .fd-need .fd-rows > li,.fd-app .fd-kc,.fd-app .fd-ev{-webkit-touch-callout:none}
}
@media (prefers-reduced-transparency: reduce){
  .fd-app .fd-mtop.is-sc,.fd-app .fx-tcap .fd-tabs,.fd-app .fx-tsrch,.fx-menu{background:var(--fd-card);-webkit-backdrop-filter:none;backdrop-filter:none}
}
@media (prefers-reduced-motion: reduce){
  .fx-pull.is-busy .fx-spin{animation:none}
  .fx-mbox,.fx-search,.fx-help,.fx-scrim.is-dim,.fd-app .fd-cf .fd-cfb,.fd-app .fd-cdet.is-on,.fx-flash{animation:none}
}
/* 15 Calendar: the now line and its time in red (Apple Calendar) */
.fd-app .fd-now,.fd-app .fd-now::before{background:var(--error-color)}
.fd-cal.is-w1:not(.is-day) .fd-chr[style="--r:7"]{visibility:hidden}
.fx-nowl{grid-column:1;grid-row:7;z-index:3;align-self:start;justify-self:end;margin:0 6px 0 0;transform:translateY(-50%);padding:0 4px;border-radius:4px;background:var(--fd-card);color:var(--error-color);font-style:normal;font-size:0.8125rem;line-height:1.125rem;letter-spacing:-0.006em;font-weight:600;pointer-events:none}
.fd-cal:not(.is-w1) .fx-nowl,.fd-cal.is-day .fx-nowl{display:none}
/* 16 the thread reads like Messages: gray bubbles from them, your color for what you send, one time under each run */
.fd-app .fd-m.is-in .fd-mb{border-color:transparent;background:color-mix(in srgb,var(--sub-color) 9%,var(--fd-card));color:var(--fd-ink)}
.fd-app .fd-m.is-out .fd-mb{border-color:transparent;background:var(--main-color);color:var(--text-on-main-color)}
.fd-app .fd-m.is-sys .fd-mb{border-color:transparent;background:var(--main-background-color);color:var(--fd-ink)}
.fd-m.is-in:has(+ .fd-m.is-in) > .fd-mt,.fd-m.is-sys:has(+ .fd-m.is-sys) > .fd-mt,.fd-m.is-out:has(+ .fd-m.is-out:not(.is-off)) > .fd-mt{display:none}
.fd-m.is-in:has(+ .fd-m.is-in) .fd-mb{border-bottom-left-radius:16px}
.fd-m.is-in + .fd-m.is-in{margin-top:-6px}
.fd-m.is-out + .fd-m.is-out,.fd-m.is-sys + .fd-m.is-sys{margin-top:-6px}
.fd-app .fx-dlv{align-self:flex-end;max-width:none;margin:-6px 4px 0 0;font-size:0.8125rem;line-height:1.125rem;letter-spacing:-0.006em;font-weight:600;color:var(--fd-muted)}
.fd-app .fx-dlv.is-off{display:none}

/* ===== Layout at every width ===== */
/* a list with a side panel: below 1200px wide the panel moves under the list, so neither gets squeezed */
@media (min-width: 1024px) and (max-width: 1199px){
  .fd-cols{grid-template-columns:minmax(0,1fr)}
  .fd-side2{position:static}
}
/* every list knows its own width: in a narrow list the buttons sit under the name and the details */
.fd-lst{container-type:inline-size;container-name:fdlst}
@container fdlst (max-width: 700px){
  .fd-lst > .fd-rw{grid-template-columns:minmax(0,1fr)}
  .fd-lst > .fd-rw > .fd-rac{justify-content:flex-start}
}
/* number tiles: a tile is never narrower than its number; the number stays on one line */
.fd-sum{grid-template-columns:repeat(auto-fit,minmax(min(100%,9.5rem),1fr))}
.fd-app .fd-smv{white-space:nowrap}
@media (max-width: 1023px){ .fd-sum{grid-template-columns:repeat(auto-fit,minmax(min(100%,6.75rem),1fr))} }
/* words break between words, never between letters */
.fd-app .fd-kn,.fd-app .fd-ks,.fd-app .fd-kad span,.fd-app .fd-ka span,.fd-app .fd-stt,.fd-app .fd-sta span,.fd-app .fd-km > span,.fd-app .fd-khn,.fd-app .fd-lsub,.fd-app .fd-dcs{overflow-wrap:break-word;word-break:normal}
/* chips: short status words stay on one line when there is room, and wrap at word gaps when there is not */
.fd-app .fd-chip{overflow-wrap:break-word}
/* the inbox: the list and the open conversation share the width; neither drops under its minimum */
@media (min-width: 1024px){
  .fd-ixg{grid-template-columns:minmax(300px,456px) minmax(360px,1fr)}
}
/* the segmented control: in a narrow spot the count sits under its label, and the labels drop to Footnote */
.fd-wseg{container-type:inline-size;container-name:fdseg}
@container fdseg (max-width: 460px){
  .fd-app .fd-wsb{flex-direction:column;gap:0;height:44px}
  .fd-app .fd-wsb .fd-wsn{font-size:0.8125rem;line-height:1.125rem;letter-spacing:-0.006em}
}
@container fdseg (max-width: 340px){
  .fd-app .fd-wsb{font-size:0.8125rem;line-height:1.125rem;letter-spacing:-0.006em}
}
/* the pipeline board (computer): every column keeps at least 208px; the board scrolls sideways inside itself when the window is narrow */
@media (min-width: 1024px){
  .fd-kb{--ncol:5;--colmax:1fr}
  .fd-kb.is-g1{--ncol:3}
  .fd-kb.is-g2{--ncol:1;--colmax:320px}
  .fd-kb.is-g3{--ncol:2;--colmax:320px}
  .fd-kwrap{overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;scroll-snap-type:x proximity;scrollbar-width:thin;padding-bottom:6px}
  .fd-kb .fd-kls,.fd-kb .fd-kg{grid-template-columns:repeat(var(--ncol),minmax(0,var(--colmax)));width:100%;min-width:calc(var(--ncol) * 208px + (var(--ncol) - 1) * 12px)}
  .fd-kb .fd-kls{right:auto}
  .fd-kb .fd-kg{grid-auto-rows:auto}
  .fd-kb.is-g1 .fd-kls i:nth-child(n+4),.fd-kb.is-g2 .fd-kls i:nth-child(n+2),.fd-kb.is-g3 .fd-kls i:nth-child(n+3){display:none}
  .fd-kb .fd-kh{scroll-snap-align:start;align-items:flex-start}
  .fd-app .fd-kb .fd-khn{white-space:normal}
}
/* Today: the two cards side by side and the four tiles need room; below 1200px the cards stack and the tiles go two by two */
@media (min-width: 1024px) and (max-width: 1199px){
  .fd-two,.fd-money{grid-template-columns:minmax(0,1fr)}
  .fd-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
}
/* Settings: a slimmer sidebar below 1280px; business details go one per row when their panel is narrow, so long key names fit */
@media (min-width: 1024px) and (max-width: 1279px){
  .fd-view[data-sec]:not(.fd-hid){grid-template-columns:200px minmax(0,1fr);column-gap:24px}
}
.fd-view[data-sec] .fd-pnl{container-type:inline-size;container-name:fdpnl}
@container fdpnl (max-width: 860px){ .fd-cvg{grid-template-columns:minmax(0,1fr)} }
/* an inbox row: the name and the wait chip share a line when they fit and wrap when they do not */
.fd-cr1{flex-wrap:wrap}
/* phone rows: buttons keep their words whole and wrap to a new line when two do not fit */
@media (max-width: 1023px){ .fd-rac .fd-btn{flex:1 1 auto;min-width:max-content} }
/* a very small phone (under 360px): the Today timeline drops its dots so names keep their room */
@media (max-width: 359px){
  .fd-stop{grid-template-columns:58px minmax(0,1fr) 44px}
  .fd-stop .fd-node,.fd-stop::before{display:none}
  .fd-app .fd-time{font-size:0.8125rem;line-height:1.125rem;letter-spacing:-0.006em}
  .fd-lead{grid-template-columns:36px minmax(0,1fr)}
  .fd-lead .fd-chip{grid-column:2;grid-row:auto;justify-self:start}
}
/* small lists in cards (Quotes out and the like): the name and the amount share line one, the status goes under */
.fd-mini{container-type:inline-size;container-name:fdmini}
@container fdmini (max-width: 380px){
  .fd-mini li{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;row-gap:0;align-items:baseline}
  .fd-mini .fd-mn{grid-column:1;grid-row:1;white-space:normal;overflow:visible}
  .fd-mini .fd-ma{grid-column:2;grid-row:1}
  .fd-mini .fd-mq{grid-column:1 / -1;grid-row:2;white-space:normal}
}
/* card buttons keep their words on one line and wrap to a new row when they do not fit */
.fd-kbs .fd-btn{flex:1 1 auto;min-width:max-content;white-space:nowrap}

/* ===== Thumb-first phone (Apple HIG: Tab bars, Toolbars, Sheets, Search fields) ===== */
.fx-acc,.fx-addscrim{display:none}
.fd-app .fx-tmore{display:none}

.fd-app .fx-ghlk{max-width:none;margin:0 0 6px;font-size:0.9375rem;line-height:1.25rem;letter-spacing:-0.016em;font-weight:600;color:var(--main-hover-color)}
.fx-acct{display:flex;align-items:center;gap:12px;margin-top:20px;padding:12px;border:1px solid var(--fd-line);border-radius:14px;background:var(--fd-page)}
.fx-acct .fd-av{flex:none;width:44px;height:44px}
.fx-acx{display:flex;flex-direction:column;min-width:0}
.fd-app .fx-acx b{font-size:1.0625rem;line-height:1.375rem;letter-spacing:-0.026em;font-weight:600;color:var(--fd-ink)}
.fd-app .fx-acx span{font-size:0.9375rem;line-height:1.25rem;letter-spacing:-0.016em;font-weight:400;color:var(--fd-muted);overflow-wrap:break-word}
.fx-addact{display:flex;flex-direction:column;gap:0}
.fd-app .fx-addx{display:none}
@media (max-width: 1023px){
  /* sign in: the brand on top, the button at the bottom, in thumb reach */
  .fd-app.fd-login .fd-lmain{display:flex;padding:0;min-height:100dvh}
  .fd-app.fd-login .fd-lcard{display:flex;flex-direction:column;flex:1 1 auto;min-height:100dvh;max-width:none;padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));border:0;border-radius:0;box-shadow:none}

  /* five tabs: Today, Pipeline, Inbox, Calendar, More */
  .fd-app .fx-tcap .fd-tabs{flex:1 1 0;min-width:0;grid-template-columns:repeat(5,minmax(0,1fr))}

 class=\"fd-fbb\"><button type=\"button\" class=\"fd-btn is-plain\" onClick=\"{{closeFb}}\">Close<\/button><\/div>\n      <\/div>\n    <\/section><div class=\"{{dg.cls}}\" role=\"alertdialog\" aria-modal=\"true\" aria-labelledby=\"fd-dg-t\"><div class=\"fd-cfb\"><button type=\"button\" class=\"{{dg.bk}}\" onClick=\"{{dg.back}}\"><svg class=\"fd-flip\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\"><path d=\"m9 6 6 6-6 6\"><\/path><\/svg><span>Back<\/span><\/button><h3 class=\"fd-cft\" id=\"fd-dg-t\"><span class=\"fd-h\">{{dg.title}}<\/span><\/h3><p class=\"{{dg.nc}}\" aria-hidden=\"true\"><span class=\"fd-h\">{{dg.n}}<\/span><\/p><p class=\"{{dg.pc}}\" aria-live=\"polite\"><span class=\"fd-h\">{{dg.line}}<\/span><\/p><div class=\"{{dg.dc}}\"><div class=\"fd-dch\"><span class=\"fd-logo\" aria-hidden=\"true\"><span class=\"fd-h\">{{cv.init}}<\/span><\/span><div><p class=\"fd-dcb\"><span class=\"fd-h\">{{cv.name}}<\/span><\/p><\/div><\/div><p class=\"fd-dcn\"><span><span class=\"fd-h\">{{dg.dt}}<\/span><\/span><\/p><p class=\"fd-dcv\"><span class=\"fd-h\">{{dg.dn}}<\/span><\/p><p class=\"fd-dcs\"><span class=\"fd-h\">{{dg.ds}}<\/span><\/p><ul class=\"fd-qln\"><li class=\"{{dg.fc}}\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M19 11.5 12 18.5a4.2 4.2 0 0 1-6-6l7.5-7.5a2.8 2.8 0 0 1 4 4L10 16.5a1.4 1.4 0 0 1-2-2l6.5-6.5\"><\/path><\/svg><span><span class=\"fd-h\">{{dg.ft}}<\/span><\/span><\/li><li class=\"{{dg.c0}}\"><span><span class=\"fd-h\">{{dg.t0}}<\/span><\/span><b><span class=\"fd-h\">{{dg.a0}}<\/span><\/b><\/li><li class=\"{{dg.c1}}\"><span><span class=\"fd-h\">{{dg.t1}}<\/span><\/span><b><span class=\"fd-h\">{{dg.a1}}<\/span><\/b><\/li><li class=\"{{dg.c2}}\"><span><span class=\"fd-h\">{{dg.t2}}<\/span><\/span><b><span class=\"fd-h\">{{dg.a2}}<\/span><\/b><\/li><li class=\"is-tot\"><span>Total<\/span><b><span class=\"fd-h\">{{dg.da}}<\/span><\/b><\/li><\/ul><\/div><div class=\"{{dg.lc}}\"><button type=\"button\" class=\"fd-btn is-fill\" onClick=\"{{dg.p0}}\">Ask again later<\/button><button type=\"button\" class=\"fd-btn is-plain\" onClick=\"{{dg.p1}}\">Said no<\/button><button type=\"button\" class=\"fd-btn is-plain\" onClick=\"{{dg.p2}}\">Chose a competitor<\/button><button type=\"button\" class=\"fd-btn is-plain\" onClick=\"{{dg.p3}}\">Not a fit<\/button><button type=\"button\" class=\"fd-btn is-plain\" onClick=\"{{dg.p4}}\">Opted out<\/button><button type=\"button\" class=\"fd-btn is-plain\" onClick=\"{{dg.cancel}}\">Cancel<\/button><\/div><div class=\"{{dg.sc}}\"><button type=\"button\" class=\"fd-btn is-fill\" onClick=\"{{dg.cancel}}\">Cancel<\/button><button type=\"button\" class=\"fd-btn is-plain\" onClick=\"{{dg.view}}\"><span class=\"fd-h\">{{dg.vt}}<\/span><\/button><\/div><\/div><\/div>\n  <\/div>\n", LOGIC = "\nclass Component extends DCLogic {\n  // ================= BACKEND NOTES: what the backend has to provide, per page. Search this file for \"BACKEND\". =================\n  // BACKEND general: every call goes through the Forge Forward backend, never from the browser to GoHighLevel. One client never reaches another client's data.\n  // BACKEND custom values, where each one shows: business_name (menu, sign in, texts, quote and invoice) \u00b7 business_owner_name (greeting, menu, texts) \u00b7 business_phone_number + business_email + business_address (quote and invoice) \u00b7\n  //   business_hours (Calendar booking line, quote and invoice) \u00b7 business_main_keyword + business_main_city + business_main_state_abbreviation (line under the business name) \u00b7 business_main_county (Leads, service area) \u00b7\n  //   business_website_url (booking link, texts, quote and invoice) \u00b7 universal_cta (Calendar booking line) \u00b7 business_logo (replaces the initials) \u00b7 business_favicon_url (tab icon, app icon) \u00b7\n  //   business_main_background_video_or_image (behind the sign-in card, images only) \u00b7 referral_reward_text (review request automation) \u00b7 seasonal_offer_text (promotion campaign automation) \u00b7 14 colors (CSS variables, every page).\n  //   Server only, never in the browser: 0_webhook_url_form (Add lead posts there). Not used by the dashboard: form_html, googlesearchconsolesiteverification (website only), body_font, headline_font, ui_font (left out on request).\n  // BACKEND custom values: GET the sub-account custom values by key (01_Business_essentials, 02_Branding colors) at sign-in; fill state \"cv\". PUT one value on Save in Settings (values only, never keys).\n  // BACKEND Sign in: \"Continue with GoHighLevel\" opens the GoHighLevel sign-in. The Marketplace app is installed on the sub-account (OAuth); the signed-in user comes from REQUEST_USER_DATA, decrypted on the server with the app's Shared Secret. The server makes the session; the browser never holds a GoHighLevel token. \"Keep me signed in\" -> long session. (Face or fingerprint: not available yet.)\n  // BACKEND Today: GET to-dos sorted by urgency (kind: lead, quote, job), number tiles (new leads, appointments, jobs this week, invoices to send), today's calendar, leads today and this week, money cards.\n  //   Buttons: Call (start call + log it), Reply (open the conversation), Approve (send the AI quote), Visit done / No-show (move the pipeline card), Yes paid / Yes send invoice (close job, make invoice, send review request), Undo for each. Directions -> open maps with the address.\n  // BACKEND Inbox: GET conversations (channel: call, text, email, web form, Facebook, Instagram; minutes waiting; needs reply), GET messages of one conversation, POST a reply on the same channel, POST mark done / flag for reply. The red number = count of needs reply.\n  // BACKEND Inbox filters: the frontend sorts each waiting conversation by its minutes waiting: under 60 = Under 1 hr, 60 to 1439 = 1 to 24 hrs, 1440+ = 24 hrs+. The wait label comes from the minutes too (min, hrs, days). Send minutes, never a ready-made label.\n  // BACKEND Calendar: GET stops (estimate or job, start, length, customer, address, reminder status) for a week. Two-way sync with the connected calendar (Google Calendar, Outlook or other).\n  //   POST add estimate / add job (name, time). PATCH move a stop (drag or Reschedule) -> text the customer the change. Undo. Directions, Call, Text per stop.\n  // BACKEND Pipeline: GET cards per stage (11 stages) (the trash icon opens a reason sheet -> POST move to Lost with one of four reasons: said no, chose a competitor, not a fit, opted out; or POST move to Check Back Later; with Undo; no trash icon on Payment Due and Lost cards) (every card before Job Done has a Job done button -> POST move to stage Job Done, with Undo) with stage tags: quote opened or not (the opened count comes from the GoHighLevel estimate status Viewed), the lost reason on a Lost card, accepted, first-time or returning customer, left a review, days late.\n  //   POST move a card to a stage (runs the stage workflow), Undo. Calendar button -> the stop of that customer. See quote -> the quote of that customer.\n  // BACKEND Leads: GET leads with source and minutes waiting; GET counts per source for the week. POST add lead (name, phone, email, full address, need). POST call / reply / book visit / undo booking. POST check-in text to leads with no contact in 3 months (asks first).\n  // BACKEND Quotes: GET quotes (lines, total, status: need, ready, sent, won, lost, later; opened count from the GoHighLevel estimate status Viewed). POST service + price or range -> the AI builds the quote. POST an uploaded quote file.\n  //   PATCH edit name / lines / prices. POST approve and send -> held 20 seconds on the server, a cancel sends nothing, no Undo after. POST accepted; POST lost with a reason or a move to Check Back Later; Undo on those.\n  // BACKEND Invoices: an invoice is created when a job is marked done. GET invoices (status: needs price / address / name, ready, sent, paid; days late). PATCH the missing field or any field. POST send -> held 20 seconds on the server, a cancel sends nothing. POST mark paid. Due 7 days after sending (placeholder).\n  // BACKEND Payments due: GET open invoices by lateness + reminder history. POST remind now, POST mark paid, Undo. Payment processor status (connected or not); a paid invoice marks itself paid when connected.\n  // BACKEND Automations: GET workflows per GoHighLevel folder (name, when, how soon, text, stops when, on/off, who acts, runs this week). POST switch on/off, PATCH edit, POST new, DELETE (asks first, Undo), POST send me a test (to business_phone_number). The referral ask is its own text one day after Job done; the review request goes one hour after Job done.\n  //   Open question: the public GoHighLevel API may not allow making, editing or removing workflows.\n  // BACKEND Settings: custom values (see above). Connections: phone number (A2P status), calendar, Facebook page, Instagram, Google My Business, online payments -> each: GET status, POST start connect (OAuth window), result. Choices: two switches saved at once.\n  // BACKEND Send feedback: POST the note to Forge Forward.\n  // ONE app. Sign in opens Today. The menu and the phone tab bar open every page. Sign out comes back to Sign in.\n  // Every page keeps what you did on it while you look at another page.\n  // \"cv\" holds the GoHighLevel custom values: the business details (01_Business_essentials) and the brand colors (02_Branding).\n  // Each color goes into the CSS variable named after its key, so a changed value changes every page. Settings edits them.\n  constructor(props) {\n    super(props);\n    this.KEYS = [\"login\", \"today\", \"inbox\", \"calendar\", \"pipeline\", \"leads\", \"quotes\", \"invoices\", \"payments\", \"automations\", \"settings\"]; this.PFX = {\"login\": \"lg_\", \"today\": \"td_\", \"inbox\": \"ib_\", \"calendar\": \"ca_\", \"pipeline\": \"pl_\", \"leads\": \"ld_\", \"quotes\": \"qt_\", \"invoices\": \"iv_\", \"payments\": \"pd_\", \"automations\": \"au_\", \"settings\": \"st_\"}; this.COL = [\"main_color\", \"main_hover_color\", \"main_light_color\", \"main_background_color\", \"main_border_color\", \"sub_color\", \"highlight_color\", \"error_color\", \"background_color\", \"section_background_color\", \"border_color\", \"text_color\", \"light_text_color\", \"text_on_main_color\"]; this.BOOT = {};\n    this.state = { page: 'login', n: 0, nv: 0, cv: {\"business_name\": \"Northway Roofing\", \"business_owner_name\": \"Mike Dalton\", \"business_phone_number\": \"+1 (614) 555-0100\", \"business_email\": \"office@northwayroofing.example\", \"business_address\": \"1200 Summit St, Columbus, OH 43201\", \"business_hours\": \"Mon - Sat: 7:00 AM - 6:00 PM\", \"business_main_city\": \"Columbus\", \"business_main_county\": \"Franklin County\", \"business_main_state_abbreviation\": \"OH\", \"business_main_keyword\": \"Roofing\", \"business_website_url\": \"https://www.northwayroofing.example\", \"universal_cta\": \"Get A Free Quote\", \"business_logo\": \"\", \"business_favicon_url\": \"\", \"business_main_background_video_or_image\": \"\", \"referral_reward_text\": \"You get $25 off your next visit for every friend who books.\", \"seasonal_offer_text\": \"Fall roof checks are booking now. Get on the list before the first storm.\", \"main_color\": \"#2E7D32\", \"main_hover_color\": \"#256528\", \"main_light_color\": \"#4AA44E\", \"main_background_color\": \"#EAF5E6\", \"main_border_color\": \"#BEDEB6\", \"sub_color\": \"#0F2740\", \"highlight_color\": \"#F5A524\", \"error_color\": \"#B3261E\", \"background_color\": \"#FFFFFF\", \"section_background_color\": \"#F1F5F8\", \"border_color\": \"#D0DAE2\", \"text_color\": \"#4A5A6B\", \"light_text_color\": \
