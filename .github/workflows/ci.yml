name: CI

on:
  pull_request:
  push:
    branches: [develop, staging, main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # lint, typecheck, test, build. No database or secrets needed.
      - run: pnpm check

  # CI does not migrate any database. Migrations for staging and main run inside the Vercel build
  # (vercel.json buildCommand -> scripts/vercel-migrate.ts), so a failed migration fails the deploy and
  # the code that needs it never goes live. One writer only. See docs/release-migrations.md.
